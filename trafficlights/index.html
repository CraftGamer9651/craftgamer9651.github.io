<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Lights — VOID ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--card:#0d1428;--border:#1a2444;--accent:#00cfff;--text:#e8eaf6;--muted:#4a5580;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,207,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,207,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:700px;height:600px;background:radial-gradient(ellipse,rgba(0,207,255,0.08) 0%,transparent 70%);pointer-events:none;z-index:0;}
nav{position:relative;z-index:1;width:100%;padding:20px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);}
.back-btn{color:var(--accent);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;transition:gap .2s;}
.back-btn:hover{gap:12px;}
.nav-title{font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-sep{color:var(--muted);}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;gap:18px;width:100%;max-width:1000px;}
h1{font-size:44px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#00cfff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;}
/* Mode tabs */
.tabs{display:flex;gap:6px;padding:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;}
.tab-btn{padding:8px 18px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .2s;background:transparent;color:var(--muted);}
.tab-btn.active{background:rgba(0,207,255,0.15);color:var(--accent);border-color:rgba(0,207,255,0.3);}
/* Canvas */
#sim-canvas{border:1px solid rgba(0,207,255,0.2);border-radius:14px;box-shadow:0 0 40px rgba(0,207,255,0.06);cursor:pointer;display:block;touch-action:none;}
/* Controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{padding:10px 22px;border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .2s;border:1px solid;}
.btn-blue{background:rgba(0,207,255,0.1);border-color:rgba(0,207,255,0.3);color:var(--accent);}
.btn-blue:hover{background:rgba(0,207,255,0.2);}
.btn-green{background:rgba(0,255,136,0.1);border-color:rgba(0,255,136,0.3);color:#00ff88;}
.btn-green:hover{background:rgba(0,255,136,0.2);}
.btn-red{background:rgba(255,68,102,0.1);border-color:rgba(255,68,102,0.3);color:#ff4466;}
.btn-red:hover{background:rgba(255,68,102,0.2);}
/* Stats */
.stats{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 18px;text-align:center;}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:800;color:var(--accent);}
/* Phase editor */
.phase-editor{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.pe-header{padding:12px 18px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.pe-body{padding:16px;display:flex;flex-direction:column;gap:12px;}
.phase-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;flex-wrap:wrap;}
.phase-name{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--text);width:80px;}
.light-indicator{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);}
.duration-label{font-size:11px;color:var(--muted);}
.duration-input{width:60px;padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;outline:none;background:#0a0f1e;}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="glow"></div>
<nav><a class="back-btn" href="index.html">← Back</a><span class="nav-sep">/</span><span class="nav-title">Traffic Lights</span></nav>
<main>
  <div style="text-align:center"><h1>TRAFFIC LIGHTS</h1><p class="sub">Simulate · Sequence · Optimise</p></div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-sim" onclick="setTab('sim')">Simulation</button>
    <button class="tab-btn" id="tab-ped" onclick="setTab('ped')">Pedestrian</button>
    <button class="tab-btn" id="tab-4way" onclick="setTab('4way')">4-Way Junction</button>
    <button class="tab-btn" id="tab-custom" onclick="setTab('custom')">Custom Timing</button>
  </div>
  <div class="stats">
    <div class="stat-box"><div class="stat-label">Phase</div><div class="stat-val" id="phase-name">—</div></div>
    <div class="stat-box"><div class="stat-label">Timer</div><div class="stat-val" id="phase-timer">0s</div></div>
    <div class="stat-box"><div class="stat-label">Cycle</div><div class="stat-val" id="cycle-count">0</div></div>
    <div class="stat-box"><div class="stat-label">Cars Passed</div><div class="stat-val" id="cars-passed">0</div></div>
  </div>
  <canvas id="sim-canvas" width="780" height="440"></canvas>
  <div class="controls">
    <button class="btn btn-green" id="play-btn" onclick="togglePlay()">⏸ Pause</button>
    <button class="btn btn-blue" onclick="stepForward()">Step →</button>
    <button class="btn btn-red" onclick="resetSim()">↺ Reset</button>
    <select id="speed-sel" style="padding:10px 14px;border-radius:8px;background:#0a0f1e;border:1px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:12px;" onchange="setSpeed(this.value)">
      <option value="1">1× Speed</option>
      <option value="2">2× Speed</option>
      <option value="4">4× Speed</option>
    </select>
  </div>
  <div class="phase-editor" id="phase-editor" style="display:none;">
    <div class="pe-header">Custom Phase Timing (seconds)</div>
    <div class="pe-body" id="pe-body"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);">
      <button class="btn btn-green" onclick="applyCustom()">Apply Changes</button>
    </div>
  </div>
</main>
<script>
const canvas=document.getElementById('sim-canvas');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;

// ── Phases ────────────────────────────────────────────────────────────────────
const PHASE_SETS={
  sim:[
    {name:'GREEN',  ns:{r:false,y:false,g:true},  ew:{r:true,y:false,g:false}, dur:30},
    {name:'YELLOW', ns:{r:false,y:true, g:false},  ew:{r:true,y:false,g:false}, dur:5},
    {name:'RED',    ns:{r:true, y:false,g:false},  ew:{r:false,y:false,g:true}, dur:30},
    {name:'AMBER',  ns:{r:true, y:false,g:false},  ew:{r:false,y:true, g:false}, dur:5},
  ],
  ped:[
    {name:'WALK',    ns:{r:false,y:false,g:true},  ew:{r:true,y:false,g:false},  ped:true,  dur:25},
    {name:'FLASHING',ns:{r:false,y:true, g:false}, ew:{r:true,y:false,g:false},  ped:'flash',dur:8},
    {name:'STOP',    ns:{r:true, y:false,g:false},  ew:{r:false,y:false,g:true},  ped:false, dur:20},
    {name:'AMBER',   ns:{r:true, y:false,g:false},  ew:{r:false,y:true, g:false}, ped:false, dur:5},
  ],
  '4way':[
    {name:'NS GREEN',  ns:{r:false,y:false,g:true},  ew:{r:true,y:false,g:false},  lr:{r:true, y:false,g:false}, dur:25},
    {name:'NS YELLOW', ns:{r:false,y:true, g:false},  ew:{r:true,y:false,g:false},  lr:{r:true, y:false,g:false}, dur:5},
    {name:'EW GREEN',  ns:{r:true, y:false,g:false},  ew:{r:false,y:false,g:true},  lr:{r:true, y:false,g:false}, dur:25},
    {name:'EW YELLOW', ns:{r:true, y:false,g:false},  ew:{r:false,y:true, g:false},  lr:{r:true, y:false,g:false}, dur:5},
    {name:'LR GREEN',  ns:{r:true, y:false,g:false},  ew:{r:true,y:false,g:false},  lr:{r:false,y:false,g:true},  dur:20},
    {name:'LR YELLOW', ns:{r:true, y:false,g:false},  ew:{r:true,y:false,g:false},  lr:{r:false,y:true, g:false},  dur:5},
  ],
  custom:[
    {name:'GREEN',  ns:{r:false,y:false,g:true},  ew:{r:true,y:false,g:false}, dur:30},
    {name:'YELLOW', ns:{r:false,y:true, g:false},  ew:{r:true,y:false,g:false}, dur:5},
    {name:'RED',    ns:{r:true, y:false,g:false},  ew:{r:false,y:false,g:true}, dur:30},
    {name:'AMBER',  ns:{r:true, y:false,g:false},  ew:{r:false,y:true, g:false}, dur:5},
  ],
};

let currentTab='sim';
let phases,phaseIdx=0,phaseTime=0,cycleCount=0,carsPassed=0;
let playing=true,speed=1,simInterval=null;
let cars=[];
let pedFlash=false,pedTimer=0;

function setTab(t){
  currentTab=t;
  ['sim','ped','4way','custom'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===t));
  document.getElementById('phase-editor').style.display=t==='custom'?'block':'none';
  resetSim();
  if(t==='custom')buildPhaseEditor();
}

function buildPhaseEditor(){
  const body=document.getElementById('pe-body');
  body.innerHTML=phases.map((p,i)=>`
    <div class="phase-row">
      <span class="phase-name">${p.name}</span>
      <div class="light-indicator" style="background:${p.ns.r?'#ff2200':p.ns.y?'#ffc800':p.ns.g?'#00ff44':'#1a2444'}"></div>
      <span style="font-size:11px;color:var(--muted)">NS</span>
      <div class="light-indicator" style="background:${p.ew.r?'#ff2200':p.ew.y?'#ffc800':p.ew.g?'#00ff44':'#1a2444'}"></div>
      <span style="font-size:11px;color:var(--muted)">EW</span>
      <span class="duration-label">Duration:</span>
      <input class="duration-input" id="dur-${i}" type="number" min="1" max="120" value="${p.dur}">
      <span style="font-size:11px;color:var(--muted)">sec</span>
    </div>`).join('');
}

function applyCustom(){
  phases.forEach((p,i)=>{const v=parseInt(document.getElementById('dur-'+i).value);if(v>0)p.dur=v;});
  resetSim();
}

function resetSim(){
  clearInterval(simInterval);
  phases=JSON.parse(JSON.stringify(PHASE_SETS[currentTab]));
  phaseIdx=0;phaseTime=0;cycleCount=0;carsPassed=0;cars=[];
  updateStats();draw();
  if(playing)startInterval();
}

function startInterval(){
  clearInterval(simInterval);
  simInterval=setInterval(tick,100/speed);
}

function togglePlay(){
  playing=!playing;
  document.getElementById('play-btn').textContent=playing?'⏸ Pause':'▶ Play';
  if(playing)startInterval();else clearInterval(simInterval);
}

function setSpeed(v){speed=parseInt(v);if(playing){clearInterval(simInterval);startInterval();}}

function stepForward(){
  if(playing)return;
  tick();draw();
}

let tickCount=0;
function tick(){
  tickCount++;
  const phase=phases[phaseIdx];
  phaseTime+=0.1;
  // Advance cars
  if(tickCount%4===0)spawnCar();
  moveCars(phase);
  if(phaseTime>=phase.dur){
    phaseTime=0;phaseIdx=(phaseIdx+1)%phases.length;
    if(phaseIdx===0)cycleCount++;
  }
  pedTimer=(pedTimer+0.1)%1;
  pedFlash=Math.floor(pedTimer*2)===0;
  updateStats();draw();
}

function updateStats(){
  const phase=phases[phaseIdx];
  document.getElementById('phase-name').textContent=phase.name;
  document.getElementById('phase-timer').textContent=(phase.dur-phaseTime).toFixed(1)+'s';
  document.getElementById('cycle-count').textContent=cycleCount;
  document.getElementById('cars-passed').textContent=carsPassed;
}

// ── Cars ──────────────────────────────────────────────────────────────────────
function spawnCar(){
  if(Math.random()<0.12){
    const dirs=['N','S','E','W'];
    const dir=dirs[Math.floor(Math.random()*dirs.length)];
    const colors=['#00cfff','#ff6bff','#00ff88','#ffc800','#ff4466'];
    const col=colors[Math.floor(Math.random()*colors.length)];
    let x,y,vx=0,vy=0;
    if(dir==='N'){x=W/2+18;y=H+20;vy=-2;}
    else if(dir==='S'){x=W/2-18;y=-20;vy=2;}
    else if(dir==='E'){x=-20;y=H/2+18;vx=2;}
    else{x=W+20;y=H/2-18;vx=-2;}
    cars.push({x,y,vx,vy,col,dir,stopped:false,passed:false});
  }
}

const STOP_LINES={N:H/2+60,S:H/2-60,E:W/2-60,W:W/2+60};

function moveCars(phase){
  const canGo={
    N:phase.ns?.g||false,S:phase.ns?.g||false,
    E:phase.ew?.g||false,W:phase.ew?.g||false
  };
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    const stop=STOP_LINES[c.dir];
    const atStop=c.dir==='N'?(c.y>stop&&c.y-stop<40):c.dir==='S'?(c.y<stop&&stop-c.y<40):c.dir==='E'?(c.x<stop&&stop-c.x<40):(c.x>stop&&c.x-stop<40);
    if(atStop&&!canGo[c.dir]){c.stopped=true;}
    else{c.stopped=false;c.x+=c.vx;c.y+=c.vy;}
    // Out of bounds
    if(c.x<-40||c.x>W+40||c.y<-40||c.y>H+40){
      if(!c.passed){carsPassed++;c.passed=true;}
      cars.splice(i,1);
    }
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle='#070c1a';ctx.fillRect(0,0,W,H);
  drawRoads();
  drawLights(phases[phaseIdx]);
  cars.forEach(drawCar);
}

function drawRoads(){
  // Road surfaces
  ctx.fillStyle='#111827';
  ctx.fillRect(W/2-44,0,88,H); // N-S
  ctx.fillRect(0,H/2-44,W,88); // E-W
  // Road markings
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.setLineDash([20,16]);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H/2-50);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2,H/2+50);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W/2-50,H/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+50,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.setLineDash([]);
  // Stop lines
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W/2,H/2+58);ctx.lineTo(W/2+44,H/2+58);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2-44,H/2-58);ctx.lineTo(W/2,H/2-58);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+58,H/2);ctx.lineTo(W/2+58,H/2+44);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2-58,H/2-44);ctx.lineTo(W/2-58,H/2);ctx.stroke();
  // Kerbs
  ctx.fillStyle='#1a2444';
  [[0,0,W/2-44,H/2-44],[W/2+44,0,W/2-44,H/2-44],
   [0,H/2+44,W/2-44,H-H/2-44],[W/2+44,H/2+44,W/2-44,H-H/2-44]].forEach(([x,y,w,h])=>{
    if(w>0&&h>0)ctx.fillRect(x,y,w,h);
  });
}

function drawLights(phase){
  // NS lights (top and bottom)
  drawTrafficLight(W/2+52,H/2-120,phase.ns,'vertical');
  drawTrafficLight(W/2-80,H/2+80,phase.ns,'vertical');
  // EW lights (left and right)
  drawTrafficLight(W/2+80,H/2+52,phase.ew,'vertical');
  drawTrafficLight(W/2-120,H/2-80,phase.ew,'vertical');
  // Pedestrian (if applicable)
  if(phase.ped!==undefined){
    const on=phase.ped===true||(phase.ped==='flash'&&pedFlash);
    drawPedLight(W/2+80,H/2-100,on);
    drawPedLight(W/2-100,H/2+80,on);
  }
  // Left/right arrows (4way mode)
  if(phase.lr){
    drawTrafficLight(W/2,H/2-140,phase.lr,'vertical');
  }
}

function drawTrafficLight(x,y,state,ori){
  ctx.fillStyle='#1a2444';roundRect(ctx,x-14,y-44,28,88,8);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;roundRect(ctx,x-14,y-44,28,88,8);ctx.stroke();
  const lights=[
    {on:state.r,onCol:'#ff2200',offCol:'#1a0000',y:y-28},
    {on:state.y,onCol:'#ffc800',offCol:'#1a1000',y:y},
    {on:state.g,onCol:'#00ff44',offCol:'#001a00',y:y+28},
  ];
  lights.forEach(l=>{
    ctx.fillStyle=l.on?l.onCol:l.offCol;
    if(l.on){ctx.shadowColor=l.onCol;ctx.shadowBlur=14;}
    ctx.beginPath();ctx.arc(x,l.y,9,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });
}

function drawPedLight(x,y,on){
  ctx.fillStyle='#1a2444';roundRect(ctx,x-16,y-24,32,48,8);ctx.fill();
  ctx.fillStyle=on?'#00ff44':'#001a00';
  if(on){ctx.shadowColor='#00ff44';ctx.shadowBlur=12;}
  ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(on?'🚶':'🚫',x,y);
  ctx.shadowBlur=0;
}

function drawCar(c){
  ctx.save();
  ctx.translate(c.x,c.y);
  if(c.dir==='N'||c.dir==='S')ctx.rotate(c.dir==='S'?0:Math.PI);
  else ctx.rotate(c.dir==='E'?Math.PI/2:-Math.PI/2);
  // Body
  ctx.fillStyle=c.col;
  ctx.shadowColor=c.col;ctx.shadowBlur=c.stopped?0:8;
  roundRect(ctx,-10,-16,20,32,4);ctx.fill();
  ctx.shadowBlur=0;
  // Windows
  ctx.fillStyle='rgba(5,8,16,0.7)';
  roundRect(ctx,-7,-12,14,12,2);ctx.fill();
  // Wheels
  ctx.fillStyle='#333';
  [[-11,-10],[-11,8],[11,-10],[11,8]].forEach(([wx,wy])=>{ctx.beginPath();ctx.arc(wx,wy,3,0,Math.PI*2);ctx.fill();});
  // Brake lights if stopped
  if(c.stopped){ctx.fillStyle='#ff2200';ctx.beginPath();ctx.arc(-8,14,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(8,14,3,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

resetSim();
</script>
</body>
</html>
