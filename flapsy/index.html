<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flapsy — VOID ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--card:#0d1428;--border:#1a2444;--accent:#00ff88;--text:#e8eaf6;--muted:#4a5580;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:700px;height:600px;background:radial-gradient(ellipse,rgba(0,255,136,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;}
nav{position:relative;z-index:1;width:100%;padding:20px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);}
.back-btn{color:var(--accent);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;transition:gap .2s;}
.back-btn:hover{gap:12px;}
.nav-title{font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-sep{color:var(--muted);}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:32px 20px 60px;gap:20px;width:100%;max-width:420px;}
h1{font-size:52px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#00ff88,#00cfaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;}
.hud{display:flex;gap:32px;}
.hud-item{text-align:center;}
.hud-label{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;}
.hud-val{font-size:28px;font-weight:800;color:var(--accent);}
.canvas-wrap{position:relative;border:2px solid rgba(0,255,136,0.25);border-radius:16px;overflow:hidden;box-shadow:0 0 40px rgba(0,255,136,0.08);}
canvas{display:block;}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,16,0.85);gap:14px;transition:opacity .3s;}
.overlay.hidden{opacity:0;pointer-events:none;}
.ov-title{font-size:36px;font-weight:800;color:var(--accent);}
.ov-sub{font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.ov-score{font-size:18px;font-weight:700;}
.btn{padding:12px 32px;background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);border-radius:8px;color:var(--accent);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn:hover{background:rgba(0,255,136,0.2);}
.hint{font-size:11px;color:var(--muted);letter-spacing:1px;}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="glow"></div>
<nav><a class="back-btn" href="index.html">← Back</a><span class="nav-sep">/</span><span class="nav-title">Flapsy</span></nav>
<main>
  <div style="text-align:center"><h1>FLAPSY</h1><p class="sub">Tap · Flap · Survive</p></div>
  <div class="hud">
    <div class="hud-item"><div class="hud-label">Score</div><div class="hud-val" id="score">0</div></div>
    <div class="hud-item"><div class="hud-label">Best</div><div class="hud-val" id="best">0</div></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="c" width="380" height="480"></canvas>
    <div class="overlay" id="overlay">
      <div class="ov-title">FLAPSY</div>
      <div class="ov-sub">Space / Tap to flap</div>
      <div class="ov-score" id="ov-score"></div>
      <button class="btn" onclick="startGame()">START</button>
    </div>
  </div>
  <div class="hint">Space or tap to flap wings</div>
</main>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const PIPE_W=52,GAP=150,GRAVITY=0.45,FLAP=-8.5,PIPE_SPEED=2.8;
let bird,pipes,score,best=parseInt(localStorage.getItem('flapsyBest')||0),running=false,raf;
document.getElementById('best').textContent=best;

function init(){
  bird={x:80,y:H/2,vy:0,r:16,dead:false,flapAnim:0};
  pipes=[];score=0;
  document.getElementById('score').textContent=0;
  spawnPipe();
}

function spawnPipe(){
  const topH=80+Math.random()*(H-GAP-160);
  pipes.push({x:W+10,topH,scored:false});
}

function startGame(){
  document.getElementById('overlay').classList.add('hidden');
  init();running=true;
  cancelAnimationFrame(raf);loop();
}

function flap(){if(!running||bird.dead)return;bird.vy=FLAP;bird.flapAnim=8;}

function loop(){
  if(!running)return;
  update();draw();
  raf=requestAnimationFrame(loop);
}

function update(){
  bird.vy+=GRAVITY;bird.y+=bird.vy;
  bird.flapAnim=Math.max(0,bird.flapAnim-1);
  if(bird.y+bird.r>H||bird.y-bird.r<0){die();return;}
  // Pipes
  if(pipes.length===0||pipes[pipes.length-1].x<W-220)spawnPipe();
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i];
    p.x-=PIPE_SPEED;
    if(!p.scored&&p.x+PIPE_W<bird.x){p.scored=true;score++;document.getElementById('score').textContent=score;}
    // Collision
    if(bird.x+bird.r-4>p.x&&bird.x-bird.r+4<p.x+PIPE_W){
      if(bird.y-bird.r<p.topH||bird.y+bird.r>p.topH+GAP){die();return;}
    }
    if(p.x+PIPE_W<-10)pipes.splice(i,1);
  }
}

function die(){
  bird.dead=true;running=false;
  if(score>best){best=score;localStorage.setItem('flapsyBest',best);document.getElementById('best').textContent=best;}
  setTimeout(()=>{
    const ov=document.getElementById('overlay');
    ov.classList.remove('hidden');
    document.querySelector('.ov-title').textContent='GAME OVER';
    document.querySelector('.ov-sub').textContent='You crashed!';
    document.getElementById('ov-score').textContent=`Score: ${score}  ·  Best: ${best}`;
    document.querySelector('.btn').textContent='PLAY AGAIN';
  },400);
}

function draw(){
  // Sky
  ctx.fillStyle='#070c1a';ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='rgba(232,234,246,0.4)';
  [[50,30],[150,20],[280,50],[340,25],[90,80],[220,15],[310,70]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();});
  // Ground
  ctx.fillStyle='#1a3344';ctx.fillRect(0,H-30,W,30);
  ctx.fillStyle='#0d2233';ctx.fillRect(0,H-32,W,4);
  // Pipes
  for(const p of pipes){
    drawPipe(p.x,0,PIPE_W,p.topH,false);
    drawPipe(p.x,p.topH+GAP,PIPE_W,H-p.topH-GAP-30,true);
  }
  // Bird
  drawBird();
}

function drawPipe(x,y,w,h,top){
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#1a5c44');g.addColorStop(0.4,'#22cc77');g.addColorStop(1,'#0d3322');
  ctx.fillStyle=g;
  ctx.beginPath();
  roundRect(ctx,x+2,top?y:y,w-4,h-(top?0:4),4);ctx.fill();
  // Cap
  ctx.fillStyle='#22cc77';
  const capH=18;
  const capY=top?y+h-capH:y;
  roundRect(ctx,x-2,capY,w+4,capH,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.fillRect(x+4,top?y:y+capH,4,h-capH);
}

function drawBird(){
  const b=bird;
  const angle=Math.min(Math.PI/4,Math.max(-Math.PI/3,b.vy*0.04));
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(angle);
  // Body
  ctx.fillStyle='#00ff88';
  ctx.beginPath();ctx.ellipse(0,0,b.r,b.r*0.8,0,0,Math.PI*2);ctx.fill();
  // Wing
  const wingY=b.flapAnim>0?-8:4;
  ctx.fillStyle='#00cc66';
  ctx.beginPath();ctx.ellipse(-4,wingY,10,6,Math.PI/6,0,Math.PI*2);ctx.fill();
  // Eye
  ctx.fillStyle='#050810';ctx.beginPath();ctx.arc(8,-4,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-5,1.5,0,Math.PI*2);ctx.fill();
  // Beak
  ctx.fillStyle='#ffa500';ctx.beginPath();ctx.moveTo(14,-2);ctx.lineTo(20,0);ctx.lineTo(14,3);ctx.closePath();ctx.fill();
  if(b.dead){ctx.strokeStyle='#ff4466';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(5,-8);ctx.lineTo(11,-2);ctx.moveTo(11,-8);ctx.lineTo(5,-2);ctx.stroke();}
  ctx.restore();
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
canvas.addEventListener('click',flap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
ctx.fillStyle='#070c1a';ctx.fillRect(0,0,W,H);
</script>
</body>
</html>
