<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkers — VOID ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050810; --surface:#0a0f1e; --card:#0d1428; --border:#1a2444;
    --accent:#ff6bff; --text:#e8eaf6; --muted:#4a5580;
    --red:#ff4466; --red-light:#ff8899;
    --blue:#6baaff; --blue-light:#99ccff;
    --dark-sq:#0d1530; --light-sq:#1a2a50;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text); font-family:'Syne',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,107,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,107,255,0.025) 1px, transparent 1px);
    background-size:40px 40px; pointer-events:none; z-index:0;
  }
  .glow {
    position:fixed; top:-300px; left:50%; transform:translateX(-50%);
    width:800px; height:600px;
    background:radial-gradient(ellipse, rgba(255,107,255,0.07) 0%, transparent 70%);
    pointer-events:none; z-index:0;
  }
  nav {
    position:relative; z-index:1; width:100%; padding:20px 32px;
    display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--border);
  }
  .back-btn {
    color:var(--accent); text-decoration:none; font-size:13px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; display:flex; align-items:center; gap:8px; transition:gap 0.2s;
  }
  .back-btn:hover { gap:12px; }
  .nav-title { font-size:13px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; }
  .nav-sep { color:var(--muted); }

  main {
    position:relative; z-index:1; display:flex; flex-direction:column;
    align-items:center; padding:32px 20px 60px; gap:20px; width:100%; max-width:520px;
  }

  .game-title { text-align:center; }
  .game-title h1 {
    font-size:48px; font-weight:800; letter-spacing:-2px;
    background:linear-gradient(135deg, var(--accent), #7b4fff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .game-title p { font-size:12px; color:var(--muted); letter-spacing:4px; text-transform:uppercase; margin-top:4px; }

  /* Toggle rows */
  .toggle-row {
    display:flex; gap:8px; padding:5px;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
  }
  .tog-btn {
    padding:9px 22px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase; transition:all 0.2s;
    background:transparent; color:var(--muted);
  }
  .tog-btn.active { background:rgba(255,107,255,0.15); color:var(--accent); border-color:rgba(255,107,255,0.3); }

  .diff-row {
    display:flex; gap:8px; padding:5px;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    transition:opacity 0.25s;
  }
  .diff-row.hidden { opacity:0.3; pointer-events:none; }
  .diff-btn {
    padding:9px 20px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase; transition:all 0.2s;
    background:transparent; color:var(--muted);
  }
  .diff-btn.easy.active   { background:rgba(0,255,136,0.12); color:#00ff88; border-color:rgba(0,255,136,0.3); }
  .diff-btn.medium.active { background:rgba(255,200,0,0.12); color:#ffc800; border-color:rgba(255,200,0,0.3); }
  .diff-btn.hard.active   { background:rgba(255,68,102,0.12); color:#ff4466; border-color:rgba(255,68,102,0.3); }

  .hud {
    display:flex; gap:32px; align-items:center; width:100%; justify-content:center;
  }
  .hud-item { text-align:center; }
  .hud-label { font-size:10px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-bottom:4px; }
  .hud-val { font-size:28px; font-weight:800; }
  .hud-val.red  { color:var(--red); }
  .hud-val.blue { color:var(--blue); }

  .status {
    font-size:15px; font-weight:700; letter-spacing:1px; text-align:center;
    padding:8px 24px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); min-width:280px; transition:color 0.3s;
  }
  .status.red-turn  { color:var(--red);  border-color:rgba(255,68,102,0.3); }
  .status.blue-turn { color:var(--blue); border-color:rgba(107,170,255,0.3); }
  .status.winner    { color:#ffd700; border-color:rgba(255,215,0,0.3); }

  .board-wrap {
    padding:20px; background:var(--card);
    border:1px solid var(--border); border-radius:16px;
    box-shadow:0 0 60px rgba(255,107,255,0.05);
  }
  .board {
    display:grid; grid-template-columns:repeat(8,56px);
    border:1px solid rgba(255,107,255,0.2); border-radius:4px; overflow:hidden;
  }
  .sq {
    width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
    cursor:default; position:relative; user-select:none;
  }
  .sq.dark  { background:var(--dark-sq); }
  .sq.light { background:var(--light-sq); }
  .sq.move-target { cursor:pointer; }
  .sq.move-target::after {
    content:''; position:absolute;
    width:30%; height:30%; border-radius:50%;
    background:rgba(255,107,255,0.4);
    pointer-events:none;
  }
  .sq.move-target.capture-target::after {
    width:80%; height:80%;
    background:transparent;
    border:3px solid rgba(255,107,255,0.5);
  }
  .sq.selected-sq { background:#2a1840 !important; }

  .piece {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:900; position:relative;
    transition:transform 0.15s; cursor:pointer;
  }
  .piece.red {
    background:radial-gradient(circle at 35% 35%, var(--red-light), var(--red));
    box-shadow:0 3px 8px rgba(255,68,102,0.5), inset 0 1px 3px rgba(255,255,255,0.3);
    color:rgba(255,255,255,0.9);
  }
  .piece.blue {
    background:radial-gradient(circle at 35% 35%, var(--blue-light), var(--blue));
    box-shadow:0 3px 8px rgba(107,170,255,0.5), inset 0 1px 3px rgba(255,255,255,0.3);
    color:rgba(255,255,255,0.9);
  }
  .piece.selected {
    transform:scale(1.15);
    box-shadow:0 0 0 3px rgba(255,107,255,0.7), 0 3px 8px rgba(0,0,0,0.4);
  }
  .piece.king::after {
    content:'♛'; position:absolute; font-size:14px; top:50%; left:50%;
    transform:translate(-50%,-50%); color:rgba(255,255,255,0.95);
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }

  .btn {
    padding:12px 32px; background:rgba(255,107,255,0.1); border:1px solid rgba(255,107,255,0.3);
    border-radius:8px; color:var(--accent); font-family:'Syne',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer; transition:all 0.2s;
  }
  .btn:hover { background:rgba(255,107,255,0.2); box-shadow:0 0 20px rgba(255,107,255,0.2); }

  .scanlines {
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events:none; z-index:999;
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="glow"></div>
<nav>
  <a class="back-btn" href="index.html">← Back</a>
  <span class="nav-sep">/</span>
  <span class="nav-title">Checkers</span>
</nav>
<main>
  <div class="game-title">
    <h1>CHECKERS</h1>
    <p>Classic Draughts</p>
  </div>

  <!-- Mode -->
  <div class="toggle-row">
    <button class="tog-btn active" id="btn-bot" onclick="setMode('bot')">vs Bot</button>
    <button class="tog-btn" id="btn-2p"  onclick="setMode('2p')">2 Players</button>
  </div>

  <!-- Difficulty -->
  <div class="diff-row" id="diff-row">
    <button class="diff-btn easy active" id="d-easy"   onclick="setDiff('easy')">Easy</button>
    <button class="diff-btn medium"      id="d-medium" onclick="setDiff('medium')">Medium</button>
    <button class="diff-btn hard"        id="d-hard"   onclick="setDiff('hard')">Hard</button>
  </div>

  <div class="hud">
    <div class="hud-item"><div class="hud-label">Red</div><div class="hud-val red"  id="cnt-red">12</div></div>
    <div class="hud-item"><div class="hud-label">Turn</div><div class="hud-val" id="turn-num" style="color:var(--muted)">1</div></div>
    <div class="hud-item"><div class="hud-label">Blue</div><div class="hud-val blue" id="cnt-blue">12</div></div>
  </div>

  <div class="status red-turn" id="status">Red's turn</div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <button class="btn" onclick="initGame()">New Game</button>
</main>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let board, turn, selected, legalMoves, turnNum, jumpPiece;
let gameMode = 'bot';
let difficulty = 'easy';

// ── Mode / Difficulty ─────────────────────────────────────────────────────────
function setMode(m) {
  gameMode = m;
  document.getElementById('btn-bot').classList.toggle('active', m === 'bot');
  document.getElementById('btn-2p').classList.toggle('active',  m === '2p');
  document.getElementById('diff-row').classList.toggle('hidden', m === '2p');
  initGame();
}

function setDiff(d) {
  difficulty = d;
  ['easy','medium','hard'].forEach(x =>
    document.getElementById('d-'+x).classList.toggle('active', x === d)
  );
  initGame();
}

// ── Init ──────────────────────────────────────────────────────────────────────
function initGame() {
  board = Array.from({length:8}, () => Array(8).fill(null));
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 8; c++)
      if ((r+c) % 2 === 1) board[r][c] = {color:'blue', king:false};
  for (let r = 5; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if ((r+c) % 2 === 1) board[r][c] = {color:'red', king:false};

  turn = 'red'; selected = null; legalMoves = []; turnNum = 1; jumpPiece = null;
  render();
  updateStatus();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  const targets = selected
    ? getAllMovesForTurn(turn).filter(m => m.fromR === selected.r && m.fromC === selected.c)
    : [];

  const movablePieces = new Set();
  getAllMovesForTurn(turn).forEach(m => movablePieces.add(m.fromR+','+m.fromC));

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      const isDark = (r+c) % 2 === 1;
      sq.className = 'sq ' + (isDark ? 'dark' : 'light');

      if (selected && selected.r === r && selected.c === c) sq.classList.add('selected-sq');

      const target = targets.find(m => m.toR === r && m.toC === c);
      if (target) {
        sq.classList.add('move-target');
        if (target.capR !== undefined) sq.classList.add('capture-target');
        sq.onclick = () => executeMove(target);
      }

      const piece = board[r][c];
      if (piece) {
        const el = document.createElement('div');
        el.className = 'piece ' + piece.color + (piece.king ? ' king' : '');
        if (selected && selected.r === r && selected.c === c) el.classList.add('selected');

        const isMyTurn = piece.color === turn;
        const canMove  = movablePieces.has(r+','+c);
        const isBotTurn = gameMode === 'bot' && turn === 'blue';
        const isJumpForced = jumpPiece && !(jumpPiece.r === r && jumpPiece.c === c);

        if (isMyTurn && canMove && !isBotTurn && !isJumpForced) {
          el.onclick = e => { e.stopPropagation(); selectPiece(r, c); };
          el.style.cursor = 'pointer';
        }
        sq.appendChild(el);
      }

      boardEl.appendChild(sq);
    }
  }

  // Piece counts
  let redC = 0, blueC = 0;
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      if (board[r][c]?.color === 'red')  redC++;
      if (board[r][c]?.color === 'blue') blueC++;
    }
  document.getElementById('cnt-red').textContent  = redC;
  document.getElementById('cnt-blue').textContent = blueC;
  document.getElementById('turn-num').textContent = turnNum;
}

// ── Selection & moves ─────────────────────────────────────────────────────────
function selectPiece(r, c) {
  const moves = getAllMovesForTurn(turn).filter(m => m.fromR === r && m.fromC === c);
  if (!moves.length) return;
  selected = {r, c};
  legalMoves = moves;
  render();
}

function executeMove(move) {
  const piece = board[move.fromR][move.fromC];
  board[move.toR][move.toC] = piece;
  board[move.fromR][move.fromC] = null;

  let captured = false;
  if (move.capR !== undefined) {
    board[move.capR][move.capC] = null;
    captured = true;
  }

  // King promotion
  if (piece.color === 'red'  && move.toR === 0) piece.king = true;
  if (piece.color === 'blue' && move.toR === 7) piece.king = true;

  // Check for forced multi-jump
  if (captured) {
    const further = getJumps(move.toR, move.toC, piece, board);
    if (further.length > 0) {
      selected   = {r: move.toR, c: move.toC};
      legalMoves = further;
      jumpPiece  = {r: move.toR, c: move.toC};
      render();
      return;
    }
  }

  // End turn
  turn = turn === 'red' ? 'blue' : 'red';
  turnNum++;
  selected = null; legalMoves = []; jumpPiece = null;
  render();
  updateStatus();

  // Bot move
  if (gameMode === 'bot' && turn === 'blue' && getAllMovesForTurn('blue').length > 0) {
    setTimeout(doBotMove, 450);
  }
}

// ── Status ────────────────────────────────────────────────────────────────────
function updateStatus() {
  const el = document.getElementById('status');
  const moves = getAllMovesForTurn(turn);
  if (!moves.length) {
    const winner = turn === 'red' ? 'Blue' : 'Red';
    el.textContent = `${winner} wins! 🏆`;
    el.className = 'status winner';
    return;
  }
  const isBotTurn = gameMode === 'bot' && turn === 'blue';
  el.textContent = isBotTurn ? 'Bot is thinking...' : `${turn === 'red' ? 'Red' : 'Blue'}'s turn`;
  el.className = 'status ' + (turn === 'red' ? 'red-turn' : 'blue-turn');
}

// ── Move generation ───────────────────────────────────────────────────────────
function getAllMovesForTurn(color) {
  const jumps = [], regular = [];
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (!p || p.color !== color) continue;
      jumps.push(...getJumps(r, c, p, board));
      regular.push(...getRegular(r, c, p, board));
    }
  // Forced capture rule
  return jumps.length > 0 ? jumps : regular;
}

function getJumps(r, c, piece, b) {
  const moves = [];
  getDirections(piece).forEach(([dr, dc]) => {
    const mr = r+dr, mc = c+dc;
    const lr = r+dr*2, lc = c+dc*2;
    if (lr < 0 || lr > 7 || lc < 0 || lc > 7) return;
    const mid  = b[mr]?.[mc];
    const land = b[lr][lc];
    if (mid && mid.color !== piece.color && !land)
      moves.push({fromR:r, fromC:c, toR:lr, toC:lc, capR:mr, capC:mc});
  });
  return moves;
}

function getRegular(r, c, piece, b) {
  const moves = [];
  getDirections(piece).forEach(([dr, dc]) => {
    const nr = r+dr, nc = c+dc;
    if (nr < 0 || nr > 7 || nc < 0 || nc > 7) return;
    if (!b[nr][nc]) moves.push({fromR:r, fromC:c, toR:nr, toC:nc});
  });
  return moves;
}

function getDirections(piece) {
  if (piece.king) return [[-1,-1],[-1,1],[1,-1],[1,1]];
  return piece.color === 'red' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
}

// ── Bot AI ────────────────────────────────────────────────────────────────────
function doBotMove() {
  const moves = getAllMovesForTurn('blue');
  if (!moves.length) return;

  let move;
  if      (difficulty === 'easy')   move = botEasy(moves);
  else if (difficulty === 'medium') move = botMedium(moves);
  else                              move = botHard(moves);

  executeMove(move);
}

// Easy: random, slight preference for captures
function botEasy(moves) {
  const caps = moves.filter(m => m.capR !== undefined);
  if (caps.length && Math.random() < 0.6) return caps[Math.floor(Math.random() * caps.length)];
  return moves[Math.floor(Math.random() * moves.length)];
}

// Medium: always capture if possible, else pick highest-scoring 1-ply move with some randomness
function botMedium(moves) {
  const caps = moves.filter(m => m.capR !== undefined);
  if (caps.length) return caps[Math.floor(Math.random() * caps.length)];
  // Score moves 1-ply, add noise
  const scored = moves.map(m => ({ m, s: scoreMove(m, 'blue') + Math.random() * 3 }));
  scored.sort((a,b) => b.s - a.s);
  return scored[0].m;
}

// Hard: minimax depth 5
function botHard(moves) {
  let best = -Infinity, bestMove = moves[0];
  for (const m of moves) {
    const nb = cloneBoard(board);
    applyMoveToBoard(nb, m);
    const s = minimax(nb, 'red', 4, -Infinity, Infinity);
    if (-s > best) { best = -s; bestMove = m; }
  }
  return bestMove;
}

function minimax(b, color, depth, alpha, beta) {
  const moves = getAllMovesForBoard(color, b);
  if (!moves.length) return color === 'blue' ? -1000 : 1000;
  if (depth === 0) return evalBoard(b);

  const next = color === 'red' ? 'blue' : 'red';
  const isMax = color === 'blue';
  let best = isMax ? -Infinity : Infinity;

  for (const m of moves) {
    const nb = cloneBoard(b);
    applyMoveToBoard(nb, m);
    const s = minimax(nb, next, depth - 1, alpha, beta);
    if (isMax) { best = Math.max(best, s); alpha = Math.max(alpha, best); }
    else        { best = Math.min(best, s); beta  = Math.min(beta, best); }
    if (beta <= alpha) break;
  }
  return best;
}

function evalBoard(b) {
  let score = 0;
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (!p) continue;
      const val = p.king ? 3 : 1;
      score += p.color === 'blue' ? val : -val;
    }
  return score;
}

function scoreMove(m, color) {
  const nb = cloneBoard(board);
  applyMoveToBoard(nb, m);
  return evalBoard(nb) * (color === 'blue' ? 1 : -1);
}

function cloneBoard(b) {
  return b.map(row => row.map(p => p ? {...p} : null));
}

function applyMoveToBoard(b, move) {
  const piece = b[move.fromR][move.fromC];
  b[move.toR][move.toC] = piece;
  b[move.fromR][move.fromC] = null;
  if (move.capR !== undefined) b[move.capR][move.capC] = null;
  if (piece.color === 'red'  && move.toR === 0) piece.king = true;
  if (piece.color === 'blue' && move.toR === 7) piece.king = true;
}

function getAllMovesForBoard(color, b) {
  const jumps = [], regular = [];
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (!p || p.color !== color) continue;
      // use inline versions that take board param
      getDirections(p).forEach(([dr, dc]) => {
        const mr = r+dr, mc = c+dc, lr = r+dr*2, lc = c+dc*2;
        if (lr >= 0 && lr <= 7 && lc >= 0 && lc <= 7) {
          const mid = b[mr]?.[mc], land = b[lr][lc];
          if (mid && mid.color !== color && !land)
            jumps.push({fromR:r, fromC:c, toR:lr, toC:lc, capR:mr, capC:mc});
        }
        const nr = r+dr, nc = c+dc;
        if (nr >= 0 && nr <= 7 && nc >= 0 && nc <= 7 && !b[nr][nc])
          regular.push({fromR:r, fromC:c, toR:nr, toC:nc});
      });
    }
  return jumps.length > 0 ? jumps : regular;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
initGame();
</script>
</body>
</html>
