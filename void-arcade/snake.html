<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — VOID ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --surface: #0a0f1e;
    --card: #0d1428;
    --border: #1a2444;
    --accent: #00ff88;
    --accent2: #00cfaa;
    --text: #e8eaf6;
    --muted: #4a5580;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:0;
  }
  .glow {
    position:fixed;
    top:-300px; left:50%;
    transform:translateX(-50%);
    width:800px; height:600px;
    background:radial-gradient(ellipse, rgba(0,255,136,0.08) 0%, transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  nav {
    position:relative;
    z-index:1;
    width:100%;
    padding:20px 32px;
    display:flex;
    align-items:center;
    gap:16px;
    border-bottom:1px solid var(--border);
  }
  .back-btn {
    color: var(--accent);
    text-decoration: none;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
    transition: gap 0.2s;
  }
  .back-btn:hover { gap:12px; }
  .nav-title {
    font-size:13px;
    color:var(--muted);
    letter-spacing:3px;
    text-transform:uppercase;
  }
  .nav-sep { color:var(--muted); }

  main {
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
    gap:24px;
    width:100%;
    max-width:600px;
  }

  .game-title {
    text-align:center;
  }
  .game-title h1 {
    font-size:52px;
    font-weight:800;
    letter-spacing:-2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .game-title p {
    font-size:12px;
    color:var(--muted);
    letter-spacing:4px;
    text-transform:uppercase;
    margin-top:4px;
  }

  .hud {
    display:flex;
    gap:32px;
    align-items:center;
  }
  .hud-item {
    text-align:center;
  }
  .hud-label {
    font-size:10px;
    color:var(--muted);
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .hud-value {
    font-size:28px;
    font-weight:800;
    color:var(--accent);
  }

  .canvas-wrapper {
    position:relative;
    border:2px solid rgba(0,255,136,0.3);
    border-radius:12px;
    overflow:hidden;
    box-shadow: 0 0 40px rgba(0,255,136,0.1), inset 0 0 40px rgba(0,0,0,0.5);
  }

  canvas {
    display:block;
  }

  .overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(5,8,16,0.88);
    gap:16px;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }

  .overlay-title {
    font-size:36px;
    font-weight:800;
    letter-spacing:-1px;
    color:var(--accent);
  }
  .overlay-sub {
    font-size:13px;
    color:var(--muted);
    letter-spacing:3px;
    text-transform:uppercase;
  }
  .overlay-score {
    font-size:18px;
    font-weight:700;
    color:var(--text);
  }

  .btn {
    padding:12px 32px;
    background:rgba(0,255,136,0.1);
    border:1px solid rgba(0,255,136,0.3);
    border-radius:8px;
    color:var(--accent);
    font-family:'Syne',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background 0.2s, box-shadow 0.2s;
    margin-top:8px;
  }
  .btn:hover {
    background:rgba(0,255,136,0.2);
    box-shadow:0 0 20px rgba(0,255,136,0.2);
  }

  .controls-hint {
    display:flex;
    gap:24px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:2px;
    text-transform:uppercase;
    text-align:center;
  }

  /* Mobile swipe note */
  .mobile-hint {
    font-size:11px;
    color:var(--muted);
    letter-spacing:1px;
    text-align:center;
  }

  .scanlines {
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events:none; z-index:999;
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="glow"></div>

<nav>
  <a class="back-btn" href="index.html">← Back</a>
  <span class="nav-sep">/</span>
  <span class="nav-title">Snake</span>
</nav>

<main>
  <div class="game-title">
    <h1>SNAKE</h1>
    <p>Eat · Grow · Survive</p>
  </div>

  <div class="hud">
    <div class="hud-item">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">High Score</div>
      <div class="hud-value" id="high-score">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">Level</div>
      <div class="hud-value" id="level">1</div>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlay-title">SNAKE</div>
      <div class="overlay-sub" id="overlay-sub">Use arrow keys or WASD</div>
      <div class="overlay-score" id="overlay-score"></div>
      <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div class="controls-hint">
    <span>↑↓←→ or WASD to move</span>
    <span>P to pause</span>
  </div>
  <div class="mobile-hint">On mobile: swipe to change direction</div>
</main>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLS = 20, ROWS = 20;
const CELL = canvas.width / COLS;

let snake, dir, nextDir, food, score, highScore, level, gameLoop, paused, running;

// Color palette for snake segments
const SNAKE_HEAD = '#00ff88';
const SNAKE_BODY = '#00cf6a';
const SNAKE_DARK = '#009e50';
const FOOD_COLOR = '#ff4466';
const FOOD_GLOW = 'rgba(255,68,102,0.4)';
const BG_COLOR = '#070c1a';
const GRID_COLOR = 'rgba(255,255,255,0.03)';

function init() {
  snake = [
    {x:10, y:10},
    {x:9,  y:10},
    {x:8,  y:10}
  ];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  level = 1;
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  highScore = parseInt(localStorage.getItem('snakeHS') || '0');
  document.getElementById('high-score').textContent = highScore;
  placeFood();
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===pos.x && s.y===pos.y));
  food = pos;
}

function getSpeed() {
  return Math.max(60, 180 - (level-1)*20);
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  init();
  running = true;
  paused = false;
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, getSpeed());
}

function tick() {
  if (paused) return;
  dir = {...nextDir};

  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision (wrap)
  head.x = (head.x + COLS) % COLS;
  head.y = (head.y + ROWS) % ROWS;

  // Self collision
  if (snake.some(s => s.x===head.x && s.y===head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    score += 10;
    if (score % 50 === 0) {
      level++;
      document.getElementById('level').textContent = level;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, getSpeed());
    }
    document.getElementById('score').textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHS', highScore);
      document.getElementById('high-score').textContent = highScore;
    }
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  // Background
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.strokeStyle = GRID_COLOR;
  ctx.lineWidth = 0.5;
  for (let x=0; x<=COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke();
  }
  for (let y=0; y<=ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke();
  }

  // Food glow
  ctx.save();
  ctx.shadowColor = FOOD_GLOW;
  ctx.shadowBlur = 16;
  ctx.fillStyle = FOOD_COLOR;
  const fr = CELL*0.38;
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, fr, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Food inner
  ctx.fillStyle = '#ff8899';
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, fr*0.5, 0, Math.PI*2);
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const ratio = i / snake.length;
    const margin = isHead ? 1 : 2;
    const r = isHead ? 5 : 4;
    const x = seg.x*CELL + margin;
    const y = seg.y*CELL + margin;
    const w = CELL - margin*2;
    const h = CELL - margin*2;

    if (isHead) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,255,136,0.5)';
      ctx.shadowBlur = 12;
    }

    // Body gradient color
    const g = ctx.createLinearGradient(x, y, x+w, y+h);
    if (isHead) {
      g.addColorStop(0, '#00ff88');
      g.addColorStop(1, '#00e070');
    } else {
      const bright = Math.max(0, 1 - ratio * 0.6);
      g.addColorStop(0, `rgba(0,${Math.floor(180*bright+40)},${Math.floor(100*bright)},1)`);
      g.addColorStop(1, `rgba(0,${Math.floor(140*bright+30)},${Math.floor(80*bright)},1)`);
    }

    ctx.fillStyle = g;
    roundRect(ctx, x, y, w, h, r);
    ctx.fill();

    if (isHead) ctx.restore();
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function gameOver() {
  clearInterval(gameLoop);
  running = false;
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  document.getElementById('overlay-title').textContent = 'GAME OVER';
  document.getElementById('overlay-sub').textContent = 'Better luck next time';
  document.getElementById('overlay-score').textContent = `Score: ${score}  |  Best: ${highScore}`;
  document.getElementById('start-btn').textContent = 'PLAY AGAIN';
}

// Keyboard
document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp':    case 'w': case 'W': if(dir.y!==1)  nextDir={x:0,y:-1}; break;
    case 'ArrowDown':  case 's': case 'S': if(dir.y!==-1) nextDir={x:0,y:1};  break;
    case 'ArrowLeft':  case 'a': case 'A': if(dir.x!==1)  nextDir={x:-1,y:0}; break;
    case 'ArrowRight': case 'd': case 'D': if(dir.x!==-1) nextDir={x:1,y:0};  break;
    case 'p': case 'P': if(running) paused=!paused; break;
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});

// Touch / swipe
let touchStartX, touchStartY;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 20 && dir.x !== -1) nextDir = {x:1, y:0};
    else if (dx < -20 && dir.x !== 1) nextDir = {x:-1, y:0};
  } else {
    if (dy > 20 && dir.y !== -1) nextDir = {x:0, y:1};
    else if (dy < -20 && dir.y !== 1) nextDir = {x:0, y:-1};
  }
  e.preventDefault();
}, {passive:false});

// Initial draw
ctx.fillStyle = BG_COLOR;
ctx.fillRect(0,0,canvas.width,canvas.height);
</script>
</body>
</html>
