<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Gates — VOID ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--card:#0d1428;--border:#1a2444;--accent:#00ff88;--text:#e8eaf6;--muted:#4a5580;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:700px;height:600px;background:radial-gradient(ellipse,rgba(0,255,136,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;}
nav{position:relative;z-index:1;width:100%;padding:20px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);}
.back-btn{color:var(--accent);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;transition:gap .2s;}
.back-btn:hover{gap:12px;}
.nav-title{font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-sep{color:var(--muted);}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;gap:16px;width:100%;max-width:820px;}
h1{font-size:44px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#00ff88,#00cfff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;}
#puzzle-canvas{border:1px solid rgba(0,255,136,0.2);border-radius:14px;box-shadow:0 0 40px rgba(0,255,136,0.06);cursor:pointer;display:block;}
.hud{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center;}
.hud-item{text-align:center;}
.hud-label{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;}
.hud-val{font-size:22px;font-weight:800;color:var(--accent);}
.status{font-size:14px;font-weight:700;letter-spacing:1px;text-align:center;color:var(--accent);min-height:24px;}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{padding:10px 24px;border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .2s;border:1px solid;}
.btn-green{background:rgba(0,255,136,0.1);border-color:rgba(0,255,136,0.3);color:var(--accent);}
.btn-green:hover{background:rgba(0,255,136,0.2);}
.btn-blue{background:rgba(0,207,255,0.1);border-color:rgba(0,207,255,0.3);color:#00cfff;}
.btn-blue:hover{background:rgba(0,207,255,0.2);}
.truth-table{border-collapse:collapse;font-size:12px;width:100%;max-width:400px;}
.truth-table th{padding:6px 12px;background:var(--card);border:1px solid var(--border);color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-size:10px;}
.truth-table td{padding:6px 12px;border:1px solid var(--border);text-align:center;font-family:monospace;font-size:14px;}
.truth-table tr.target{background:rgba(0,255,136,0.06);}
.tt-1{color:#00ff88;}.tt-0{color:#ff4466;}
.puzzle-nav{display:flex;gap:12px;align-items:center;}
.puzzle-num{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:2px;}
.hint-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:12px;color:var(--muted);line-height:1.6;max-width:500px;text-align:center;}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="glow"></div>
<nav><a class="back-btn" href="index.html">← Back</a><span class="nav-sep">/</span><span class="nav-title">Logic Gates</span></nav>
<main>
  <div style="text-align:center"><h1>LOGIC GATES</h1><p class="sub">Wire · Toggle · Solve</p></div>
  <div class="hud">
    <div class="hud-item"><div class="hud-label">Puzzle</div><div class="hud-val" id="puzzle-num">1/10</div></div>
    <div class="hud-item"><div class="hud-label">Solved</div><div class="hud-val" id="solved-count">0</div></div>
  </div>
  <div class="status" id="lg-status">Toggle inputs to match the target output</div>
  <canvas id="puzzle-canvas" width="780" height="360"></canvas>
  <div class="controls">
    <div class="puzzle-nav">
      <button class="btn btn-blue" onclick="prevPuzzle()">← Prev</button>
      <span class="puzzle-num" id="puz-label">Puzzle 1</span>
      <button class="btn btn-blue" onclick="nextPuzzle()">Next →</button>
    </div>
    <button class="btn btn-green" onclick="checkSolution()">Check ✓</button>
  </div>
  <table class="truth-table" id="truth-table"></table>
  <div class="hint-box" id="hint-box"></div>
</main>
<script>
const canvas=document.getElementById('puzzle-canvas');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const HIGH='#00ff88',LOW='#ff4466',WIRE='#1a3344',GATE_BG='#0d1428',GATE_BORDER='#1a2444';

// Gate logic
const GATE_FN={
  AND:  (a,b)=>a&&b,
  OR:   (a,b)=>a||b,
  NOT:  (a)=>!a,
  NAND: (a,b)=>!(a&&b),
  NOR:  (a,b)=>!(a||b),
  XOR:  (a,b)=>a!==b,
  XNOR: (a,b)=>a===b,
  BUF:  (a)=>a,
};

// Puzzles: each has inputs (toggleable), a gate network, and target output
const PUZZLES=[
  {name:'Simple AND',hint:'Both inputs must be 1 for AND to output 1.',
   inputs:[{label:'A',val:false},{label:'B',val:false}],
   gates:[{type:'AND',in:[0,1],x:400,y:180}],output:0,target:true},
  {name:'Simple OR',hint:'At least one input must be 1 for OR to output 1.',
   inputs:[{label:'A',val:false},{label:'B',val:false}],
   gates:[{type:'OR',in:[0,1],x:400,y:180}],output:0,target:true},
  {name:'NOT Gate',hint:'NOT inverts the input: 0→1, 1→0.',
   inputs:[{label:'A',val:true}],
   gates:[{type:'NOT',in:[0],x:400,y:180}],output:0,target:true},
  {name:'NAND Gate',hint:'NAND = NOT AND. Output is 0 only when both inputs are 1.',
   inputs:[{label:'A',val:false},{label:'B',val:false}],
   gates:[{type:'NAND',in:[0,1],x:400,y:180}],output:0,target:false},
  {name:'XOR Gate',hint:'XOR outputs 1 when inputs are different.',
   inputs:[{label:'A',val:false},{label:'B',val:false}],
   gates:[{type:'XOR',in:[0,1],x:400,y:180}],output:0,target:true},
  {name:'Chain: AND → NOT',hint:'Wire an AND gate into a NOT gate (NAND).',
   inputs:[{label:'A',val:false},{label:'B',val:false}],
   gates:[{type:'AND',in:[0,1],x:280,y:180},{type:'NOT',in:['g0'],x:520,y:180}],output:1,target:true},
  {name:'Two Gates',hint:'OR two pairs of inputs then AND the results.',
   inputs:[{label:'A',val:false},{label:'B',val:false},{label:'C',val:false},{label:'D',val:false}],
   gates:[{type:'OR',in:[0,1],x:260,y:120},{type:'OR',in:[2,3],x:260,y:240},{type:'AND',in:['g0','g1'],x:520,y:180}],output:2,target:true},
  {name:'Half Adder Sum',hint:'XOR of two bits gives the sum bit of a half adder.',
   inputs:[{label:'A',val:false},{label:'B',val:false}],
   gates:[{type:'XOR',in:[0,1],x:400,y:180}],output:0,target:true},
  {name:'NOR Logic',hint:'NOR outputs 1 only when ALL inputs are 0.',
   inputs:[{label:'A',val:false},{label:'B',val:false}],
   gates:[{type:'NOR',in:[0,1],x:400,y:180}],output:0,target:true},
  {name:'Complex Chain',hint:'Build: (A AND B) OR (NOT C)',
   inputs:[{label:'A',val:false},{label:'B',val:false},{label:'C',val:true}],
   gates:[{type:'AND',in:[0,1],x:240,y:120},{type:'NOT',in:[2],x:240,y:260},{type:'OR',in:['g0','g1'],x:520,y:180}],output:2,target:true},
];

let currentPuzzle=0,solved=new Set(),inputs,gates;

function loadPuzzle(idx){
  const p=PUZZLES[idx];
  inputs=p.inputs.map(i=>({...i}));
  gates=p.gates.map(g=>({...g}));
  document.getElementById('puz-label').textContent='Puzzle '+(idx+1);
  document.getElementById('puzzle-num').textContent=(idx+1)+'/'+PUZZLES.length;
  document.getElementById('lg-status').textContent='Toggle inputs (click) to match target output = '+(p.target?'1':'0');
  document.getElementById('hint-box').textContent='💡 '+p.hint;
  buildTruthTable(p);
  draw();
}

function buildTruthTable(p){
  const nIn=p.inputs.length;
  const rows=Math.pow(2,nIn);
  let html=`<tr>${p.inputs.map(i=>`<th>${i.label}</th>`).join('')}<th>Output</th><th>Target</th></tr>`;
  for(let r=0;r<rows;r++){
    const vals=Array.from({length:nIn},(_,i)=>!!(r>>(nIn-1-i)&1));
    const out=evalGates(p.gates,vals,p.output);
    const match=out===p.target;
    html+=`<tr class="${match?'target':''}">
      ${vals.map(v=>`<td class="tt-${v?1:0}">${v?1:0}</td>`).join('')}
      <td class="tt-${out?1:0}">${out?1:0}</td>
      <td class="tt-${p.target?1:0}">${p.target?1:0} ${match?'✓':''}</td>
    </tr>`;
  }
  document.getElementById('truth-table').innerHTML=html;
}

function evalGates(gatesDef,inVals,outputGateIdx){
  const gateOuts=[];
  for(const g of gatesDef){
    const getVal=src=>typeof src==='number'?inVals[src]:gateOuts[parseInt(src.slice(1))];
    const a=getVal(g.in[0]);
    const b=g.in[1]!==undefined?getVal(g.in[1]):undefined;
    gateOuts.push(GATE_FN[g.type](a,b));
  }
  return gateOuts[outputGateIdx];
}

function evalCurrent(){
  const inVals=inputs.map(i=>i.val);
  return evalGates(gates,inVals,PUZZLES[currentPuzzle].output);
}

function checkSolution(){
  const out=evalCurrent();
  const target=PUZZLES[currentPuzzle].target;
  if(out===target){
    solved.add(currentPuzzle);
    document.getElementById('solved-count').textContent=solved.size;
    document.getElementById('lg-status').textContent='✅ Correct! Output = '+(out?1:0);
    draw();
  }else{
    document.getElementById('lg-status').textContent='❌ Output = '+(out?1:0)+' — target is '+(target?1:0);
  }
}

function draw(){
  ctx.fillStyle='#070c1a';ctx.fillRect(0,0,W,H);
  const inVals=inputs.map(i=>i.val);
  const gateOuts=[];
  for(const g of gates){
    const getVal=src=>typeof src==='number'?inVals[src]:gateOuts[parseInt(src.slice(1))];
    const a=getVal(g.in[0]);const b=g.in[1]!==undefined?getVal(g.in[1]):undefined;
    gateOuts.push(GATE_FN[g.type](a,b));
  }

  // Draw inputs
  const inputX=80;
  inputs.forEach((inp,i)=>{
    const y=100+(i*(H-140))/(Math.max(inputs.length-1,1));
    inp._y=y;
    // Toggle button
    ctx.fillStyle=inp.val?HIGH:LOW;
    ctx.shadowColor=inp.val?HIGH:LOW;ctx.shadowBlur=inp.val?16:4;
    ctx.beginPath();ctx.roundRect(inputX-30,y-18,60,36,8);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#050810';ctx.font='bold 14px Syne,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(inp.label+':'+(inp.val?1:0),inputX,y);
  });

  // Draw gates and wires
  gates.forEach((g,gi)=>{
    const gx=g.x,gy=g.y;
    const getY=src=>{
      if(typeof src==='number')return inputs[src]._y;
      const pi=parseInt(src.slice(1));return gates[pi].y;
    };
    const getX=src=>typeof src==='number'?inputX+30:gates[parseInt(src.slice(1))].x+50;
    const getVal=src=>typeof src==='number'?inVals[src]:gateOuts[parseInt(src.slice(1))];

    // Input wires
    g.in.forEach(src=>{
      const wx=getX(src),wy=getY(src);
      const val=getVal(src);
      ctx.strokeStyle=val?HIGH:LOW;ctx.lineWidth=2;ctx.shadowColor=val?HIGH:LOW;ctx.shadowBlur=val?6:0;
      ctx.beginPath();ctx.moveTo(wx,wy);
      ctx.bezierCurveTo(wx+(gx-50-wx)/2,wy,gx-50,gy,gx-50,gy);
      ctx.stroke();ctx.shadowBlur=0;
    });

    // Gate body
    const out=gateOuts[gi];
    ctx.fillStyle=GATE_BG;ctx.strokeStyle=out?'rgba(0,255,136,0.5)':'rgba(255,255,255,0.1)';ctx.lineWidth=1.5;
    ctx.shadowColor=out?HIGH:'transparent';ctx.shadowBlur=out?10:0;
    ctx.beginPath();ctx.roundRect(gx-50,gy-28,100,56,10);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle=out?HIGH:'#e8eaf6';ctx.font='bold 14px Syne,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(g.type,gx,gy);

    // Output wire stub
    ctx.strokeStyle=out?HIGH:LOW;ctx.lineWidth=2;ctx.shadowColor=out?HIGH:LOW;ctx.shadowBlur=out?6:0;
    ctx.beginPath();ctx.moveTo(gx+50,gy);ctx.lineTo(gx+80,gy);ctx.stroke();
    ctx.shadowBlur=0;
    g._outX=gx+80;g._outY=gy;
  });

  // Final output node
  const finalGateIdx=PUZZLES[currentPuzzle].output;
  const finalOut=gateOuts[finalGateIdx];
  const ox=gates[finalGateIdx]._outX||680,oy=gates[finalGateIdx]._outY||H/2;
  ctx.fillStyle=finalOut?HIGH:LOW;
  ctx.shadowColor=finalOut?HIGH:LOW;ctx.shadowBlur=finalOut?20:6;
  ctx.beginPath();ctx.arc(ox+20,oy,18,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#050810';ctx.font='bold 15px Syne,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(finalOut?'1':'0',ox+20,oy);
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px Syne,sans-serif';
  ctx.fillText('OUT',ox+20,oy+30);
}

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  inputs.forEach((inp,i)=>{
    const ix=80,iy=inp._y||0;
    if(Math.abs(mx-ix)<35&&Math.abs(my-iy)<22){inp.val=!inp.val;}
  });
  draw();
  document.getElementById('lg-status').textContent='Current output: '+(evalCurrent()?1:0)+' | Target: '+(PUZZLES[currentPuzzle].target?1:0);
});

function prevPuzzle(){if(currentPuzzle>0){currentPuzzle--;loadPuzzle(currentPuzzle);}}
function nextPuzzle(){if(currentPuzzle<PUZZLES.length-1){currentPuzzle++;loadPuzzle(currentPuzzle);}}
loadPuzzle(0);
</script>
</body>
</html>
