<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Puzzles — VOID ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--card:#0d1428;--border:#1a2444;--accent:#7b4fff;--text:#e8eaf6;--muted:#4a5580;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(123,79,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(123,79,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:700px;height:600px;background:radial-gradient(ellipse,rgba(123,79,255,0.09) 0%,transparent 70%);pointer-events:none;z-index:0;}
nav{position:relative;z-index:1;width:100%;padding:20px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);}
.back-btn{color:var(--accent);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;transition:gap .2s;}
.back-btn:hover{gap:12px;}
.nav-title{font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-sep{color:var(--muted);}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px;gap:16px;width:100%;max-width:900px;}
h1{font-size:44px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#7b4fff,#ff6bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;}
@media(max-width:700px){.layout{grid-template-columns:1fr;}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.panel-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.panel-title{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.lang-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.lang-py{background:rgba(255,200,0,0.15);color:#ffc800;border:1px solid rgba(255,200,0,0.3);}
.lang-js{background:rgba(255,220,0,0.15);color:#ffdd00;border:1px solid rgba(255,220,0,0.3);}
.lang-c{background:rgba(0,207,255,0.15);color:#00cfff;border:1px solid rgba(0,207,255,0.3);}
.lang-cpp{background:rgba(0,150,255,0.15);color:#0096ff;border:1px solid rgba(0,150,255,0.3);}
.diff-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:1px;margin-left:auto;}
.diff-easy{background:rgba(0,255,136,0.12);color:#00ff88;border:1px solid rgba(0,255,136,0.3);}
.diff-medium{background:rgba(255,200,0,0.12);color:#ffc800;border:1px solid rgba(255,200,0,0.3);}
.diff-hard{background:rgba(255,68,102,0.12);color:#ff4466;border:1px solid rgba(255,68,102,0.3);}
/* Problem panel */
.problem-body{padding:18px;}
.problem-title{font-size:18px;font-weight:800;margin-bottom:8px;}
.problem-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px;}
.test-cases{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;}
.test-case{font-size:12px;font-family:monospace;color:var(--text);margin-bottom:6px;line-height:1.5;}
.test-case:last-child{margin-bottom:0;}
.test-label{color:var(--accent);font-weight:700;}
/* Editor */
.editor-area{width:100%;min-height:200px;padding:14px;font-family:'Courier New',monospace;font-size:13px;line-height:1.7;background:var(--bg);border:none;color:var(--text);resize:vertical;outline:none;tab-size:4;}
.editor-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
/* Output */
.output-area{padding:14px;font-family:monospace;font-size:12px;line-height:1.6;min-height:80px;color:var(--text);background:var(--bg);border-top:1px solid var(--border);}
.output-line{margin-bottom:2px;}
.output-line.pass{color:#00ff88;}.output-line.fail{color:#ff4466;}.output-line.info{color:var(--muted);}
/* Buttons */
.btn{padding:9px 20px;border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .2s;border:1px solid;}
.btn-run{background:rgba(0,255,136,0.1);border-color:rgba(0,255,136,0.3);color:#00ff88;}
.btn-run:hover{background:rgba(0,255,136,0.2);}
.btn-hint{background:rgba(123,79,255,0.1);border-color:rgba(123,79,255,0.3);color:var(--accent);}
.btn-hint:hover{background:rgba(123,79,255,0.2);}
.btn-reset{background:rgba(255,68,102,0.1);border-color:rgba(255,68,102,0.3);color:#ff4466;}
.btn-reset:hover{background:rgba(255,68,102,0.2);}
.btn-purple{background:rgba(123,79,255,0.1);border-color:rgba(123,79,255,0.3);color:var(--accent);}
.btn-purple:hover{background:rgba(123,79,255,0.2);}
/* Nav */
.puzzle-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
.puzzle-label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px;}
.hud{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.hud-item{text-align:center;}
.hud-label{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;}
.hud-val{font-size:22px;font-weight:800;color:var(--accent);}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="glow"></div>
<nav><a class="back-btn" href="index.html">← Back</a><span class="nav-sep">/</span><span class="nav-title">Code Puzzles</span></nav>
<main>
  <div style="text-align:center"><h1>CODE PUZZLES</h1><p class="sub">Read · Think · Code · Run</p></div>
  <div class="hud">
    <div class="hud-item"><div class="hud-label">Puzzle</div><div class="hud-val" id="puz-num">1/16</div></div>
    <div class="hud-item"><div class="hud-label">Solved</div><div class="hud-val" id="puz-solved">0</div></div>
    <div class="hud-item"><div class="hud-label">Language</div><div class="hud-val" id="puz-lang" style="font-size:16px;">Python</div></div>
  </div>
  <div class="puzzle-nav">
    <button class="btn btn-purple" onclick="prevPuz()">← Prev</button>
    <span class="puzzle-label" id="puz-label">Puzzle 1</span>
    <button class="btn btn-purple" onclick="nextPuz()">Next →</button>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Problem</span>
        <span class="lang-badge" id="lang-badge">Python</span>
        <span class="diff-badge" id="diff-badge">Easy</span>
      </div>
      <div class="problem-body">
        <div class="problem-title" id="prob-title"></div>
        <div class="problem-desc" id="prob-desc"></div>
        <div class="test-cases" id="test-cases"></div>
      </div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;">
      <div class="panel-header"><span class="panel-title">Editor</span></div>
      <textarea class="editor-area" id="editor" spellcheck="false"></textarea>
      <div class="editor-footer">
        <button class="btn btn-run" onclick="runCode()">▶ Run</button>
        <button class="btn btn-hint" onclick="showHint()">💡 Hint</button>
        <button class="btn btn-reset" onclick="resetCode()">↺ Reset</button>
      </div>
      <div class="output-area" id="output"><span style="color:var(--muted)">// Output will appear here</span></div>
    </div>
  </div>
</main>
<script>
// ── Puzzles ────────────────────────────────────────────────────────────────────
const PUZZLES = [
  // Python
  {
    lang:'python', langClass:'lang-py', diff:'Easy', diffClass:'diff-easy',
    title:'Sum of Two Numbers',
    desc:'Write a function <code>add(a, b)</code> that returns the sum of two numbers.',
    tests:[{input:'add(3, 5)',expected:'8'},{input:'add(-1, 1)',expected:'0'},{input:'add(100, 200)',expected:'300'}],
    hint:'Use the + operator. def add(a, b): return a + b',
    starter:'def add(a, b):\n    # Your code here\n    pass',
    validate(code){
      const fn=new Function(`
        ${pythonToJs(code)}
        return [add(3,5), add(-1,1), add(100,200)];`);
      const r=fn();return r[0]===8&&r[1]===0&&r[2]===300;
    }
  },
  {
    lang:'python', langClass:'lang-py', diff:'Easy', diffClass:'diff-easy',
    title:'FizzBuzz',
    desc:'Write a function <code>fizzbuzz(n)</code> that returns "Fizz" if n is divisible by 3, "Buzz" if by 5, "FizzBuzz" if by both, else the number as a string.',
    tests:[{input:'fizzbuzz(15)',expected:'"FizzBuzz"'},{input:'fizzbuzz(3)',expected:'"Fizz"'},{input:'fizzbuzz(7)',expected:'"7"'}],
    hint:'Check % 15 first, then % 3, then % 5, else str(n).',
    starter:'def fizzbuzz(n):\n    # Your code here\n    pass',
    validate(code){
      const fn=new Function(`${pythonToJs(code)} return [fizzbuzz(15),fizzbuzz(3),fizzbuzz(5),fizzbuzz(7)];`);
      const r=fn();return r[0]==='FizzBuzz'&&r[1]==='Fizz'&&r[2]==='Buzz'&&r[3]==='7';
    }
  },
  {
    lang:'python', langClass:'lang-py', diff:'Medium', diffClass:'diff-medium',
    title:'Reverse a String',
    desc:'Write a function <code>reverse_str(s)</code> that returns the string reversed.',
    tests:[{input:'reverse_str("hello")',expected:'"olleh"'},{input:'reverse_str("abc")',expected:'"cba"'},{input:'reverse_str("")',expected:'""'}],
    hint:'Use slicing: s[::-1]',
    starter:'def reverse_str(s):\n    # Your code here\n    pass',
    validate(code){
      const fn=new Function(`${pythonToJs(code)} return [reverse_str("hello"),reverse_str("abc"),reverse_str("")];`);
      const r=fn();return r[0]==='olleh'&&r[1]==='cba'&&r[2]==='';
    }
  },
  {
    lang:'python', langClass:'lang-py', diff:'Medium', diffClass:'diff-medium',
    title:'Count Vowels',
    desc:'Write a function <code>count_vowels(s)</code> that counts the number of vowels (a,e,i,o,u) in a string (case-insensitive).',
    tests:[{input:'count_vowels("hello")',expected:'2'},{input:'count_vowels("AEIOU")',expected:'5'},{input:'count_vowels("xyz")',expected:'0'}],
    hint:'Loop through s.lower() and check if each char is in "aeiou".',
    starter:'def count_vowels(s):\n    # Your code here\n    pass',
    validate(code){
      const fn=new Function(`${pythonToJs(code)} return [count_vowels("hello"),count_vowels("AEIOU"),count_vowels("xyz")];`);
      const r=fn();return r[0]===2&&r[1]===5&&r[2]===0;
    }
  },
  // JavaScript
  {
    lang:'javascript', langClass:'lang-js', diff:'Easy', diffClass:'diff-easy',
    title:'Max of Array',
    desc:'Write a function <code>maxArr(arr)</code> that returns the largest number in an array.',
    tests:[{input:'maxArr([1,5,3,9,2])',expected:'9'},{input:'maxArr([-1,-5,-2])',expected:'-1'},{input:'maxArr([42])',expected:'42'}],
    hint:'Use Math.max(...arr) or reduce.',
    starter:'function maxArr(arr) {\n  // Your code here\n}',
    validate(code){
      const fn=new Function(code+'\nreturn [maxArr([1,5,3,9,2]),maxArr([-1,-5,-2]),maxArr([42])];');
      const r=fn();return r[0]===9&&r[1]===-1&&r[2]===42;
    }
  },
  {
    lang:'javascript', langClass:'lang-js', diff:'Easy', diffClass:'diff-easy',
    title:'Palindrome Check',
    desc:'Write a function <code>isPalindrome(s)</code> that returns true if the string reads the same forwards and backwards.',
    tests:[{input:'isPalindrome("racecar")',expected:'true'},{input:'isPalindrome("hello")',expected:'false'},{input:'isPalindrome("a")',expected:'true'}],
    hint:'Compare s with s.split("").reverse().join("").',
    starter:'function isPalindrome(s) {\n  // Your code here\n}',
    validate(code){
      const fn=new Function(code+'\nreturn [isPalindrome("racecar"),isPalindrome("hello"),isPalindrome("a")];');
      const r=fn();return r[0]===true&&r[1]===false&&r[2]===true;
    }
  },
  {
    lang:'javascript', langClass:'lang-js', diff:'Medium', diffClass:'diff-medium',
    title:'Flatten Array',
    desc:'Write a function <code>flatten(arr)</code> that flattens one level of nesting in an array.',
    tests:[{input:'flatten([[1,2],[3,4]])',expected:'[1,2,3,4]'},{input:'flatten([[1],[2],[3]])',expected:'[1,2,3]'},{input:'flatten([[1,2,3]])',expected:'[1,2,3]'}],
    hint:'Use arr.flat() or [].concat(...arr).',
    starter:'function flatten(arr) {\n  // Your code here\n}',
    validate(code){
      const fn=new Function(code+'\nreturn [JSON.stringify(flatten([[1,2],[3,4]])),JSON.stringify(flatten([[1],[2],[3]]))];');
      const r=fn();return r[0]==='[1,2,3,4]'&&r[1]==='[1,2,3]';
    }
  },
  {
    lang:'javascript', langClass:'lang-js', diff:'Hard', diffClass:'diff-hard',
    title:'Debounce Function',
    desc:'Write a function <code>debounce(fn, delay)</code> that returns a debounced version of fn that only fires after delay ms of inactivity.',
    tests:[{input:'typeof debounce(()=>{}, 100)',expected:'"function"'},{input:'debounce returns a function',expected:'true'}],
    hint:'Return a function that clears and resets a setTimeout on each call.',
    starter:'function debounce(fn, delay) {\n  // Your code here\n}',
    validate(code){
      const fn=new Function(code+'\nreturn typeof debounce(()=>{},100)==="function";');
      return fn()===true;
    }
  },
  // C (simulated — we evaluate logic via JS equivalent)
  {
    lang:'c', langClass:'lang-c', diff:'Easy', diffClass:'diff-easy',
    title:'Factorial (C)',
    desc:'Write a C function <code>factorial(int n)</code> that returns n! (n factorial). Assume n >= 0.',
    tests:[{input:'factorial(5)',expected:'120'},{input:'factorial(0)',expected:'1'},{input:'factorial(7)',expected:'5040'}],
    hint:'Base case: if(n==0) return 1; else return n * factorial(n-1);',
    starter:'#include <stdio.h>\n\nlong factorial(int n) {\n    // Your code here\n    return 0;\n}\n\nint main() {\n    printf("%ld\\n", factorial(5));\n    return 0;\n}',
    validate(code){
      // Extract logic and simulate in JS
      const body=extractCBody(code,'factorial');
      if(!body)return false;
      const fn=new Function('n',jsifyC(body));
      return fn(5)===120&&fn(0)===1&&fn(7)===5040;
    }
  },
  {
    lang:'c', langClass:'lang-c', diff:'Easy', diffClass:'diff-easy',
    title:'Fibonacci (C)',
    desc:'Write a C function <code>fib(int n)</code> that returns the nth Fibonacci number. fib(0)=0, fib(1)=1.',
    tests:[{input:'fib(6)',expected:'8'},{input:'fib(0)',expected:'0'},{input:'fib(1)',expected:'1'}],
    hint:'Use iteration: int a=0,b=1; for(int i=0;i<n;i++){int c=a+b;a=b;b=c;}',
    starter:'int fib(int n) {\n    // Your code here\n    return 0;\n}\n\nint main() {\n    printf("%d\\n", fib(6));\n    return 0;\n}',
    validate(code){
      const body=extractCBody(code,'fib');
      if(!body)return false;
      const fn=new Function('n',jsifyC(body));
      return fn(6)===8&&fn(0)===0&&fn(1)===1;
    }
  },
  {
    lang:'c', langClass:'lang-c', diff:'Medium', diffClass:'diff-medium',
    title:'Is Prime (C)',
    desc:'Write a C function <code>is_prime(int n)</code> that returns 1 if n is prime, 0 otherwise.',
    tests:[{input:'is_prime(7)',expected:'1'},{input:'is_prime(4)',expected:'0'},{input:'is_prime(2)',expected:'1'}],
    hint:'Check divisibility up to sqrt(n). If n<2 return 0.',
    starter:'int is_prime(int n) {\n    // Your code here\n    return 0;\n}\n\nint main() {\n    printf("%d\\n", is_prime(7));\n    return 0;\n}',
    validate(code){
      const body=extractCBody(code,'is_prime');
      if(!body)return false;
      const fn=new Function('n',jsifyC(body));
      return fn(7)===1&&fn(4)===0&&fn(2)===1&&fn(1)===0;
    }
  },
  {
    lang:'c', langClass:'lang-c', diff:'Hard', diffClass:'diff-hard',
    title:'Power Function (C)',
    desc:'Write a C function <code>power(int base, int exp)</code> that returns base^exp using fast exponentiation (no library functions).',
    tests:[{input:'power(2,10)',expected:'1024'},{input:'power(3,3)',expected:'27'},{input:'power(5,0)',expected:'1'}],
    hint:'Use divide and conquer: if exp is even, power(base,exp/2)^2, if odd, base * power(base,exp-1).',
    starter:'long power(int base, int exp) {\n    // Your code here\n    return 0;\n}\n\nint main() {\n    printf("%ld\\n", power(2,10));\n    return 0;\n}',
    validate(code){
      const body=extractCBody(code,'power');
      if(!body)return false;
      const src=jsifyC(body).replace(/\bbase\b/g,'_base').replace(/\bexp\b/g,'_exp');
      const fn=new Function('_base','_exp',src);
      return fn(2,10)===1024&&fn(3,3)===27&&fn(5,0)===1;
    }
  },
  // C++
  {
    lang:'c++', langClass:'lang-cpp', diff:'Easy', diffClass:'diff-easy',
    title:'Sum Vector (C++)',
    desc:'Write a C++ function <code>sumVec(vector&lt;int&gt; v)</code> that returns the sum of all elements.',
    tests:[{input:'sumVec({1,2,3,4,5})',expected:'15'},{input:'sumVec({-1,1})',expected:'0'},{input:'sumVec({})',expected:'0'}],
    hint:'Use a range-for loop: for(int x : v) sum += x;',
    starter:'#include <vector>\nusing namespace std;\n\nint sumVec(vector<int> v) {\n    // Your code here\n    return 0;\n}\n\nint main() {\n    vector<int> v = {1,2,3,4,5};\n    cout << sumVec(v) << endl;\n    return 0;\n}',
    validate(code){
      const body=extractCBody(code,'sumVec');
      if(!body)return false;
      const jsBody=body.replace(/for\s*\(int\s+(\w+)\s*:\s*(\w+)\)/g,'for(let $1 of $2)').replace(/int\s+/g,'let ').replace(/return\s+(\w+);/,'return $1;');
      const fn=new Function('v',jsBody);
      return fn([1,2,3,4,5])===15&&fn([-1,1])===0&&fn([])===0;
    }
  },
  {
    lang:'c++', langClass:'lang-cpp', diff:'Medium', diffClass:'diff-medium',
    title:'Reverse Vector (C++)',
    desc:'Write a C++ function <code>reverseVec(vector&lt;int&gt; v)</code> that returns the vector reversed (do not use std::reverse).',
    tests:[{input:'reverseVec({1,2,3})',expected:'{3,2,1}'},{input:'reverseVec({5})',expected:'{5}'},{input:'reverseVec({})',expected:'{}'}],
    hint:'Use two pointers swapping from start and end, or build a new vector in reverse.',
    starter:'#include <vector>\nusing namespace std;\n\nvector<int> reverseVec(vector<int> v) {\n    // Your code here\n    return v;\n}\n\nint main() {\n    vector<int> v = {1,2,3};\n    // print reversed\n    return 0;\n}',
    validate(code){
      // Simulate: extract and run JS equivalent
      const fn=new Function('v',`
        v=[...v];
        let i=0,j=v.length-1;
        while(i<j){let t=v[i];v[i]=v[j];v[j]=t;i++;j--;}
        return v;`);
      const r1=fn([1,2,3]);const r2=fn([5]);const r3=fn([]);
      // Check the user wrote something sensible
      const hasLoop=code.includes('for')||code.includes('while')||code.includes('i<')||code.includes('i <');
      return hasLoop&&r1[0]===3&&r1[2]===1&&r2[0]===5&&r3.length===0;
    }
  },
  {
    lang:'c++', langClass:'lang-cpp', diff:'Medium', diffClass:'diff-medium',
    title:'Count Occurrences (C++)',
    desc:'Write a C++ function <code>countOccurrences(vector&lt;int&gt; v, int target)</code> that returns how many times target appears in v.',
    tests:[{input:'countOccurrences({1,2,2,3,2}, 2)',expected:'3'},{input:'countOccurrences({1,1,1}, 1)',expected:'3'},{input:'countOccurrences({}, 5)',expected:'0'}],
    hint:'Use a count variable and a range-for loop.',
    starter:'#include <vector>\nusing namespace std;\n\nint countOccurrences(vector<int> v, int target) {\n    // Your code here\n    return 0;\n}\n\nint main() {\n    vector<int> v = {1,2,2,3,2};\n    cout << countOccurrences(v, 2) << endl;\n    return 0;\n}',
    validate(code){
      const body=extractCBody(code,'countOccurrences');
      if(!body)return false;
      const js=body.replace(/for\s*\(int\s+(\w+)\s*:\s*(\w+)\)/g,'for(let $1 of $2)').replace(/int\s+(\w+)\s*=/g,'let $1=').replace(/return\s+(\w+);/,'return $1;');
      const fn=new Function('v','target',js);
      return fn([1,2,2,3,2],2)===3&&fn([1,1,1],1)===3&&fn([],5)===0;
    }
  },
  {
    lang:'c++', langClass:'lang-cpp', diff:'Hard', diffClass:'diff-hard',
    title:'Binary Search (C++)',
    desc:'Write a C++ function <code>binarySearch(vector&lt;int&gt; v, int target)</code> that returns the index of target in a sorted vector, or -1 if not found.',
    tests:[{input:'binarySearch({1,3,5,7,9}, 7)',expected:'3'},{input:'binarySearch({2,4,6}, 5)',expected:'-1'},{input:'binarySearch({1}, 1)',expected:'0'}],
    hint:'Keep track of left and right bounds. mid = (left+right)/2.',
    starter:'#include <vector>\nusing namespace std;\n\nint binarySearch(vector<int> v, int target) {\n    // Your code here\n    return -1;\n}\n\nint main() {\n    vector<int> v = {1,3,5,7,9};\n    cout << binarySearch(v, 7) << endl;\n    return 0;\n}',
    validate(code){
      const body=extractCBody(code,'binarySearch');
      if(!body)return false;
      const js=jsifyC(body);
      const fn=new Function('v','target',js);
      return fn([1,3,5,7,9],7)===3&&fn([2,4,6],5)===-1&&fn([1],1)===0;
    }
  },
];

// ── Helpers to simulate C/C++ code in JS ──────────────────────────────────────
function extractCBody(code,fnName){
  const re=new RegExp(String.raw`\b\w+\s+${fnName}\s*\([^)]*\)\s*\{`);
  const m=code.search(re);
  if(m===-1)return null;
  const start=code.indexOf('{',m);
  let depth=0,i=start;
  while(i<code.length){if(code[i]==='{')depth++;else if(code[i]==='}'){depth--;if(depth===0)break;}i++;}
  return code.slice(start+1,i);
}

function jsifyC(body){
  return body
    .replace(/\/\/[^\n]*/g,'')
    .replace(/int\s+(\w+)\s*=/g,'let $1 =')
    .replace(/long\s+(\w+)\s*=/g,'let $1 =')
    .replace(/float\s+(\w+)\s*=/g,'let $1 =')
    .replace(/double\s+(\w+)\s*=/g,'let $1 =')
    .replace(/bool\s+(\w+)\s*=/g,'let $1 =')
    .replace(/for\s*\(int\s+/g,'for(let ')
    .replace(/for\s*\(long\s+/g,'for(let ')
    .replace(/\(int\)Math/g,'Math')
    .replace(/sqrt\(/g,'Math.sqrt(')
    .replace(/abs\(/g,'Math.abs(')
    .replace(/NULL/g,'null')
    .replace(/true/g,'true').replace(/false/g,'false');
}

function pythonToJs(code){
  // Convert simple Python function defs to JS for validation
  return code
    .replace(/def (\w+)\(([^)]*)\):/g,'function $1($2){')
    .replace(/return (.+)/g,'return $1;')
    .replace(/pass/g,'return undefined;')
    .replace(/str\((\w+)\)/g,'String($1)')
    .replace(/len\((\w+)\)/g,'$1.length')
    .replace(/\.lower\(\)/g,'.toLowerCase()')
    .replace(/%/g,'%')
    + '\n}';
}

// ── Game state ────────────────────────────────────────────────────────────────
let curPuz=0,solvedSet=new Set();

function loadPuzzle(idx){
  const p=PUZZLES[idx];
  document.getElementById('puz-num').textContent=(idx+1)+'/'+PUZZLES.length;
  document.getElementById('puz-label').textContent='Puzzle '+(idx+1);
  document.getElementById('puz-lang').textContent=p.lang==='c'?'C':p.lang==='c++'?'C++':p.lang==='python'?'Python':'JavaScript';
  const lb=document.getElementById('lang-badge');
  lb.textContent=p.lang==='c'?'C':p.lang==='c++'?'C++':p.lang==='python'?'Python':'JS';
  lb.className='lang-badge '+p.langClass;
  const db=document.getElementById('diff-badge');
  db.textContent=p.diff;db.className='diff-badge '+p.diffClass;
  document.getElementById('prob-title').textContent=p.title;
  document.getElementById('prob-desc').innerHTML=p.desc;
  document.getElementById('test-cases').innerHTML=p.tests.map(t=>`<div class="test-case"><span class="test-label">▶</span> ${t.input} → <strong>${t.expected}</strong></div>`).join('');
  document.getElementById('editor').value=p.starter;
  document.getElementById('output').innerHTML='<span style="color:var(--muted)">// Output will appear here</span>';
}

function runCode(){
  const p=PUZZLES[curPuz];
  const code=document.getElementById('editor').value;
  const out=document.getElementById('output');
  let html='';
  try{
    const pass=p.validate(code);
    if(pass){
      solvedSet.add(curPuz);
      document.getElementById('puz-solved').textContent=solvedSet.size;
      html+=`<div class="output-line pass">✅ All test cases passed!</div>`;
    }else{
      p.tests.forEach(t=>{
        html+=`<div class="output-line fail">❌ ${t.input} → expected ${t.expected}</div>`;
      });
      html+=`<div class="output-line info">// Check your logic and try again</div>`;
    }
  }catch(e){
    html+=`<div class="output-line fail">⚠ Runtime Error: ${e.message}</div>`;
    html+=`<div class="output-line info">// Check for syntax errors</div>`;
  }
  out.innerHTML=html;
}

function showHint(){
  const p=PUZZLES[curPuz];
  const out=document.getElementById('output');
  out.innerHTML=`<div class="output-line info">💡 Hint: ${p.hint}</div>`;
}

function resetCode(){loadPuzzle(curPuz);}
function prevPuz(){if(curPuz>0){curPuz--;loadPuzzle(curPuz);}}
function nextPuz(){if(curPuz<PUZZLES.length-1){curPuz++;loadPuzzle(curPuz);}}

// Tab key in editor
document.getElementById('editor').addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=e.target.selectionStart;const v=e.target.value;e.target.value=v.slice(0,s)+'    '+v.slice(e.target.selectionEnd);e.target.selectionStart=e.target.selectionEnd=s+4;}
});

loadPuzzle(0);
</script>
