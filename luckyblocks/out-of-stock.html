<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Out of Stock - Lucky Blocks</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="logo"><img src="7.png" alt="Lucky Blocks logo" style="width:100%;height:100%;object-fit:contain;border-radius:12px;"></div>
      <div>
        <h1>Lucky Blocks</h1>
        <p class="lead">Official Lucky Blocks Store</p>
      </div>
    </div>
  </header>

  <div class="card-page">
    <div class="card-box">
      <h1 style="color:var(--accent)">Out of Stock</h1>
      <p>Sorry, this item is currently unavailable.</p>
      <a href="index.html" class="btn">Back to Store</a>

      <div class="signup" style="margin-top:20px;">
        <button class="btn" id="show-form">Notify Me</button>
        <form id="notify-form" action="https://formspree.io/f/xwprpyol" method="POST" style="display:none;margin-top:16px;">
          <input type="email" name="email" placeholder="Enter your email" required style="padding:10px;width:100%;border-radius:8px;border:1px solid rgba(255,255,255,0.2);margin-bottom:12px;font-size:14px;">
          <button type="submit" class="btn" style="width:100%;">Sign Up</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-title">LUCKY BLOCKS</div>
    <div class="footer-credits">created by <strong>eoqw</strong> and <strong>CraftGamer</strong></div>
  </footer>

  <script>
    const btn=document.getElementById("show-form");
    const form=document.getElementById("notify-form");
    btn.addEventListener("click",()=>{form.style.display="block";btn.style.display="none";});
  </script>
</body>
</html>
