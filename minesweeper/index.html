<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper — VOID ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--card:#0d1428;--border:#1a2444;--accent:#00cfff;--text:#e8eaf6;--muted:#4a5580;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,207,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,207,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.glow{position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:700px;height:600px;background:radial-gradient(ellipse,rgba(0,207,255,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;}
nav{position:relative;z-index:1;width:100%;padding:20px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);}
.back-btn{color:var(--accent);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;transition:gap .2s;}
.back-btn:hover{gap:12px;}
.nav-title{font-size:13px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-sep{color:var(--muted);}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:32px 20px 60px;gap:20px;width:100%;max-width:640px;}
h1{font-size:48px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#00cfff,#7b4fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;}
.hud{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center;}
.hud-item{text-align:center;}
.hud-label{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;}
.hud-val{font-size:24px;font-weight:800;color:var(--accent);}
.diff-row{display:flex;gap:8px;padding:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;}
.diff-btn{padding:9px 20px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .2s;background:transparent;color:var(--muted);}
.diff-btn.easy.active{background:rgba(0,255,136,0.12);color:#00ff88;border-color:rgba(0,255,136,0.3);}
.diff-btn.medium.active{background:rgba(255,200,0,0.12);color:#ffc800;border-color:rgba(255,200,0,0.3);}
.diff-btn.hard.active{background:rgba(255,68,102,0.12);color:#ff4466;border-color:rgba(255,68,102,0.3);}
#board-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 0 40px rgba(0,207,255,0.06);overflow:auto;max-width:100%;}
#board{display:inline-grid;gap:3px;}
.cell{
  width:32px;height:32px;border-radius:6px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;cursor:pointer;user-select:none;
  background:var(--card);transition:background .1s,border-color .1s;
}
.cell:hover:not(.revealed):not(.exploded){background:rgba(0,207,255,0.08);border-color:rgba(0,207,255,0.3);}
.cell.revealed{background:#070c1a;border-color:#0d1a30;cursor:default;}
.cell.flagged{background:rgba(255,200,0,0.08);border-color:rgba(255,200,0,0.3);}
.cell.exploded{background:rgba(255,68,102,0.2);border-color:rgba(255,68,102,0.5);}
.cell.mine-reveal{background:rgba(255,68,102,0.1);}
.n1{color:#00cfff;}.n2{color:#00ff88;}.n3{color:#ff4466;}.n4{color:#7b4fff;}.n5{color:#ff6bff;}.n6{color:#ffc800;}.n7{color:#ff8800;}.n8{color:#e8eaf6;}
.btn{padding:12px 32px;background:rgba(0,207,255,0.1);border:1px solid rgba(0,207,255,0.3);border-radius:8px;color:var(--accent);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn:hover{background:rgba(0,207,255,0.2);}
.status{font-size:16px;font-weight:700;letter-spacing:1px;min-height:24px;text-align:center;}
.hint{font-size:11px;color:var(--muted);letter-spacing:1px;}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="glow"></div>
<nav><a class="back-btn" href="index.html">← Back</a><span class="nav-sep">/</span><span class="nav-title">Minesweeper</span></nav>
<main>
  <div style="text-align:center"><h1>MINES</h1><p class="sub">Click · Flag · Survive</p></div>
  <div class="diff-row">
    <button class="diff-btn easy active" id="d-easy" onclick="setDiff('easy')">Easy 9×9</button>
    <button class="diff-btn medium" id="d-medium" onclick="setDiff('medium')">Medium 16×16</button>
    <button class="diff-btn hard" id="d-hard" onclick="setDiff('hard')">Hard 30×16</button>
  </div>
  <div class="hud">
    <div class="hud-item"><div class="hud-label">💣 Mines</div><div class="hud-val" id="mine-count">0</div></div>
    <div class="hud-item"><div class="hud-label">🚩 Flags</div><div class="hud-val" id="flag-count">0</div></div>
    <div class="hud-item"><div class="hud-label">⏱ Time</div><div class="hud-val" id="sw-timer">0</div></div>
  </div>
  <div class="status" id="sw-status"></div>
  <div id="board-wrap"><div id="board"></div></div>
  <div class="hint">Left click to reveal · Right click to flag</div>
  <button class="btn" onclick="initGame()">New Game</button>
</main>
<script>
const CONFIGS={easy:{cols:9,rows:9,mines:10},medium:{cols:16,rows:16,mines:40},hard:{cols:30,rows:16,mines:99}};
let diff='easy',grid=[],revealed=[],flagged=[],gameOver=false,firstClick=true,timerInterval=null,elapsed=0,flags=0;

function setDiff(d){diff=d;['easy','medium','hard'].forEach(x=>document.getElementById('d-'+x).classList.toggle('active',x===d));initGame();}

function initGame(){
  clearInterval(timerInterval);elapsed=0;gameOver=false;firstClick=true;flags=0;
  document.getElementById('sw-timer').textContent='0';
  document.getElementById('sw-status').textContent='';
  const {cols,rows,mines}=CONFIGS[diff];
  document.getElementById('mine-count').textContent=mines;
  document.getElementById('flag-count').textContent='0';
  grid=Array.from({length:rows},()=>Array(cols).fill(0));
  revealed=Array.from({length:rows},()=>Array(cols).fill(false));
  flagged=Array.from({length:rows},()=>Array(cols).fill(false));
  renderBoard();
}

function placeMines(safeR,safeC){
  const {cols,rows,mines}=CONFIGS[diff];
  let placed=0;
  while(placed<mines){
    const r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);
    if(grid[r][c]===-1)continue;
    if(Math.abs(r-safeR)<=1&&Math.abs(c-safeC)<=1)continue;
    grid[r][c]=-1;placed++;
  }
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(grid[r][c]===-1)continue;
    let n=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&grid[nr][nc]===-1)n++;
    }
    grid[r][c]=n;
  }
}

function renderBoard(){
  const {cols,rows}=CONFIGS[diff];
  const board=document.getElementById('board');
  board.style.gridTemplateColumns=`repeat(${cols},32px)`;
  board.innerHTML='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.r=r;cell.dataset.c=c;
    if(revealed[r][c]){
      cell.classList.add('revealed');
      const v=grid[r][c];
      if(v===-1){cell.classList.add('mine-reveal');cell.textContent='💣';}
      else if(v>0){cell.textContent=v;cell.classList.add('n'+v);}
    }else if(flagged[r][c]){
      cell.classList.add('flagged');cell.textContent='🚩';
    }
    cell.addEventListener('click',()=>clickCell(r,c));
    cell.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c);});
    board.appendChild(cell);
  }
}

function clickCell(r,c){
  if(gameOver||revealed[r][c]||flagged[r][c])return;
  if(firstClick){firstClick=false;placeMines(r,c);timerInterval=setInterval(()=>{elapsed++;document.getElementById('sw-timer').textContent=elapsed;},1000);}
  if(grid[r][c]===-1){boom(r,c);return;}
  reveal(r,c);checkWin();renderBoard();
}

function reveal(r,c){
  const {cols,rows}=CONFIGS[diff];
  if(r<0||r>=rows||c<0||c>=cols||revealed[r][c]||flagged[r][c])return;
  revealed[r][c]=true;
  if(grid[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc);
}

function toggleFlag(r,c){
  if(gameOver||revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];
  flags+=flagged[r][c]?1:-1;
  document.getElementById('flag-count').textContent=flags;
  renderBoard();
}

function boom(r,c){
  clearInterval(timerInterval);gameOver=true;
  const {cols,rows}=CONFIGS[diff];
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)if(grid[i][j]===-1)revealed[i][j]=true;
  revealed[r][c]=true;
  renderBoard();
  const board=document.getElementById('board');
  const idx=r*CONFIGS[diff].cols+c;
  board.children[idx].classList.add('exploded');
  board.children[idx].textContent='💥';
  document.getElementById('sw-status').textContent='💥 BOOM! Better luck next time.';
  document.getElementById('sw-status').style.color='#ff4466';
}

function checkWin(){
  const {cols,rows,mines}=CONFIGS[diff];
  let unrevealed=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!revealed[r][c])unrevealed++;
  if(unrevealed===mines){
    clearInterval(timerInterval);gameOver=true;
    document.getElementById('sw-status').textContent=`🏆 You won in ${elapsed}s!`;
    document.getElementById('sw-status').style.color='#ffd700';
  }
}
initGame();
</script>
</body>
</html>
