<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QuickTube — Play & Search YouTube</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>QuickTube</h1>
    <p class="lead">Paste a YouTube link, search for videos, or pick something trending.</p>

    <!-- URL PLAYER CARD -->
    <div class="card">
      <label for="urlInput">Paste YouTube URL or ID</label>
      <div class="input-row">
        <input id="urlInput" placeholder="https://youtube.com/watch?v=dQw4w9WgXcQ">
        <button id="playBtn" class="btn">Play</button>
      </div>

      <div class="options">
        <label><input type="checkbox" id="autoplay"> Autoplay</label>
        <label><input type="checkbox" id="nocookie" checked> No-Cookie Embed</label>
        <label>Start at: <input id="startAt" type="number" min="0" value="0" class="small-number"> sec</label>
      </div>
    </div>

    <!-- SEARCH SECTION -->
    <div class="card">
      <h2>Search YouTube</h2>
      <div class="input-row">
        <input id="searchInput" placeholder="Search for videos…">
        <button id="searchBtn" class="btn-secondary">Search</button>
      </div>
      <div id="searchResults" class="video-list"></div>
    </div>

    <!-- POPULAR VIDEOS -->
    <div class="card">
      <h2>Popular / Trending Videos</h2>
      <div id="trendingList" class="video-list"></div>
    </div>

    <!-- VIDEO PLAYER -->
    <div id="playerWrapper" class="player-wrapper hidden">
      <div class="player-container" id="playerContainer"></div>
    </div>

    <footer>
      <small>Uses YouTube embeds & YouTube Data API v3.</small>
    </footer>
  </main>

  <script src="script.js"></script>
  <button id="backToTop" class="back-to-top hidden">Back to top ⬆️</button>
</body>
</html>
