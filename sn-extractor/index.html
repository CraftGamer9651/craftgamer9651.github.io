<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Extractor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f12;
    --surface: #161a20;
    --surface2: #1e242d;
    --accent: #00e5a0;
    --accent2: #005f43;
    --text: #e8ecf0;
    --muted: #5a6472;
    --danger: #ff4d6d;
    --warn: #f59e0b;
    --border: #252c36;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 760px;
    margin-bottom: 20px;
  }

  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* Drop Zone */
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 56px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  #dropzone.hover, #dropzone:hover {
    border-color: var(--accent);
    background: rgba(0,229,160,0.04);
  }

  #dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .drop-icon {
    font-size: 40px;
    margin-bottom: 12px;
    display: block;
    filter: grayscale(0.4);
  }

  .drop-title {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .drop-sub { color: var(--muted); font-size: 13px; }

  /* Queue */
  #queue-section { display: none; }

  #queue {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 4px;
  }

  #queue::-webkit-scrollbar { width: 4px; }
  #queue::-webkit-scrollbar-track { background: transparent; }
  #queue::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .thumb {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 1;
  }

  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .thumb-status {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(13,15,18,0.75);
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    gap: 4px;
    transition: opacity 0.2s;
  }

  .thumb-status.idle { opacity: 0; }
  .thumb-status.processing { opacity: 1; color: var(--warn); }
  .thumb-status.done { opacity: 1; color: var(--accent); }
  .thumb-status.error { opacity: 1; color: var(--danger); }

  .thumb-sn {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(13,15,18,0.88);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    padding: 4px 6px;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Actions */
  .actions {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 12px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-export {
    background: var(--accent2);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-export:hover:not(:disabled) { background: var(--accent); color: #000; }
  .btn-export:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Progress */
  #progress-section { display: none; }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    width: 0%;
    transition: width 0.3s ease;
  }

  .progress-text {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* Results table */
  #results-section { display: none; }

  #results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  #results-table thead tr {
    border-bottom: 1px solid var(--border);
  }

  #results-table th {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 12px;
    text-align: left;
    font-weight: 400;
  }

  #results-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(37,44,54,0.5);
    vertical-align: middle;
  }

  #results-table tr:last-child td { border-bottom: none; }

  .sn-cell {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .status-badge.ok { background: rgba(0,229,160,0.1); color: var(--accent); }
  .status-badge.err { background: rgba(255,77,109,0.1); color: var(--danger); }
  .status-badge.pending { background: rgba(245,158,11,0.1); color: var(--warn); }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(245,158,11,0.2);
    border-top-color: var(--warn);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  /* Scrollable table wrapper */
  .table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .count-pill {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 99px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    color: var(--muted);
    margin-left: 8px;
  }

  .concurrency-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
  }

  .concurrency-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  select.concurrency-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .name-cell {
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">// Label Scanner</div>
  <h1>Serial Number<br><span>Extractor</span></h1>
  <p class="subtitle">Upload label images → get a CSV of serial numbers</p>
</header>

<!-- Upload Card -->
<div class="card">
  <div class="section-label">01 — Upload Images</div>
  <div id="dropzone">
    <input type="file" id="file-input" multiple accept="image/*">
    <span class="drop-icon">📦</span>
    <div class="drop-title">Drop images here</div>
    <div class="drop-sub">or click to browse · JPG, PNG, WEBP, HEIC</div>
  </div>
</div>

<!-- Queue Card -->
<div class="card" id="queue-section">
  <div class="section-label">
    02 — Queue
    <span class="count-pill" id="queue-count">0</span>
  </div>
  <div id="queue"></div>
</div>

<!-- Actions Card -->
<div class="card">
  <div class="section-label">03 — Extract</div>
  <div class="actions">
    <button class="btn btn-primary" id="run-btn" disabled>⚡ Run Extraction</button>
    <button class="btn btn-ghost" id="clear-btn" disabled>Clear All</button>
    <div class="concurrency-row">
      <span class="concurrency-label">Parallel</span>
      <select class="concurrency-select" id="concurrency">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="5">5</option>
      </select>
    </div>
  </div>
</div>

<!-- Progress Card -->
<div class="card" id="progress-section">
  <div class="section-label">04 — Progress</div>
  <div class="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>
  <div class="progress-text" id="progress-text">0 / 0 processed</div>
</div>

<!-- Results Card -->
<div class="card" id="results-section">
  <div class="section-label" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <span>05 — Results</span>
    <button class="btn btn-export" id="export-btn" disabled>↓ Export CSV</button>
  </div>
  <div class="table-wrap">
    <table id="results-table">
      <thead>
        <tr>
          <th>#</th>
          <th>File</th>
          <th>Serial Number</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>
</div>

<script>
const fileInput = document.getElementById('file-input');
const dropzone = document.getElementById('dropzone');
const queue = document.getElementById('queue');
const queueSection = document.getElementById('queue-section');
const queueCount = document.getElementById('queue-count');
const runBtn = document.getElementById('run-btn');
const clearBtn = document.getElementById('clear-btn');
const progressSection = document.getElementById('progress-section');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const resultsSection = document.getElementById('results-section');
const resultsBody = document.getElementById('results-body');
const exportBtn = document.getElementById('export-btn');
const concurrencySelect = document.getElementById('concurrency');

let files = [];
let results = [];

// Drag & Drop
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('hover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('hover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('hover');
  addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
});
fileInput.addEventListener('change', () => {
  addFiles([...fileInput.files]);
  fileInput.value = '';
});

function addFiles(newFiles) {
  if (!newFiles.length) return;
  files = [...files, ...newFiles];
  renderQueue();
}

function renderQueue() {
  queue.innerHTML = '';
  files.forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const div = document.createElement('div');
    div.className = 'thumb';
    div.id = `thumb-${i}`;
    div.innerHTML = `
      <img src="${url}" alt="${f.name}">
      <div class="thumb-status idle" id="status-${i}">
        <span>⏳</span><span>Pending</span>
      </div>
    `;
    queue.appendChild(div);
  });
  queueCount.textContent = files.length;
  queueSection.style.display = files.length ? 'block' : 'none';
  runBtn.disabled = files.length === 0;
  clearBtn.disabled = files.length === 0;
}

clearBtn.addEventListener('click', () => {
  files = [];
  results = [];
  renderQueue();
  resultsBody.innerHTML = '';
  resultsSection.style.display = 'none';
  progressSection.style.display = 'none';
  exportBtn.disabled = true;
});

runBtn.addEventListener('click', runExtraction);

async function runExtraction() {
  runBtn.disabled = true;
  clearBtn.disabled = true;
  results = new Array(files.length).fill(null);
  resultsBody.innerHTML = '';
  progressSection.style.display = 'block';
  resultsSection.style.display = 'block';

  // Seed table rows
  files.forEach((f, i) => {
    const tr = document.createElement('tr');
    tr.id = `row-${i}`;
    tr.innerHTML = `
      <td style="color:var(--muted);font-family:'Space Mono',monospace;font-size:11px">${i+1}</td>
      <td class="name-cell" title="${f.name}">${f.name}</td>
      <td class="sn-cell" id="sn-${i}">—</td>
      <td id="badge-${i}"><span class="status-badge pending"><span class="spinner"></span>Waiting</span></td>
    `;
    resultsBody.appendChild(tr);
  });

  const concurrency = parseInt(concurrencySelect.value);
  let idx = 0;
  let done = 0;

  function updateProgress() {
    const pct = Math.round((done / files.length) * 100);
    progressBar.style.width = pct + '%';
    progressText.textContent = `${done} / ${files.length} processed`;
  }
  updateProgress();

  async function worker() {
    while (idx < files.length) {
      const i = idx++;
      const f = files[i];

      // Set processing state
      const statusEl = document.getElementById(`status-${i}`);
      statusEl.className = 'thumb-status processing';
      statusEl.innerHTML = '<span class="spinner" style="border-top-color:var(--warn)"></span><span>Reading</span>';
      document.getElementById(`badge-${i}`).innerHTML = '<span class="status-badge pending"><span class="spinner"></span>Reading</span>';

      try {
        const sn = await extractSN(f);
        results[i] = { filename: f.name, sn, ok: true };
        document.getElementById(`sn-${i}`).textContent = sn || 'Not found';
        document.getElementById(`badge-${i}`).innerHTML = `<span class="status-badge ${sn ? 'ok' : 'err'}">${sn ? '✓ Found' : '✗ Not found'}</span>`;
        statusEl.className = `thumb-status ${sn ? 'done' : 'error'}`;
        statusEl.innerHTML = sn
          ? `<span>✓</span>`
          : `<span>?</span>`;

        // Show SN chip on thumb
        const thumb = document.getElementById(`thumb-${i}`);
        if (sn) {
          const chip = document.createElement('div');
          chip.className = 'thumb-sn';
          chip.textContent = sn;
          thumb.appendChild(chip);
        }
      } catch (err) {
        results[i] = { filename: f.name, sn: '', ok: false, error: err.message };
        document.getElementById(`sn-${i}`).textContent = 'Error';
        document.getElementById(`badge-${i}`).innerHTML = `<span class="status-badge err">✗ Error</span>`;
        const statusEl2 = document.getElementById(`status-${i}`);
        statusEl2.className = 'thumb-status error';
        statusEl2.innerHTML = '<span>✗</span>';
      }

      done++;
      updateProgress();
    }
  }

  const workers = Array.from({length: concurrency}, () => worker());
  await Promise.all(workers);

  runBtn.disabled = false;
  clearBtn.disabled = false;
  exportBtn.disabled = false;
}

async function extractSN(file) {
  const b64 = await fileToBase64(file);
  const mediaType = file.type || 'image/jpeg';

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 200,
      messages: [{
        role: 'user',
        content: [
          {
            type: 'image',
            source: { type: 'base64', media_type: mediaType, data: b64 }
          },
          {
            type: 'text',
            text: 'Look at this label image. Find the serial number which appears after the text "SN:" or "SN" on the label. Reply with ONLY the serial number value, nothing else. If no serial number is found, reply with exactly: NOT_FOUND'
          }
        ]
      }]
    })
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data.error?.message || 'API error');

  const text = data.content?.find(b => b.type === 'text')?.text?.trim() || '';
  if (!text || text === 'NOT_FOUND') return null;
  return text;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

exportBtn.addEventListener('click', () => {
  const rows = [['#', 'Filename', 'Serial Number']];
  results.forEach((r, i) => {
    if (r) rows.push([i + 1, r.filename, r.sn || '']);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'serial_numbers.csv';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
