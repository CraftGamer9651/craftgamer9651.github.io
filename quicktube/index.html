<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QuickTube — Play & Search YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg: linear-gradient(180deg, #0f1724 0%, #020617 100%);
      --card: #0b1220;
      --accent: #80ef80;
      --muted: #94a3b8;
      --text: #e6eef8;
      --radius: 10px;
      --input-border: 1px solid rgba(255,255,255,.08);
    }

    :root.light{
      --bg: #ffffff;
      --card: #ffffff;
      --accent: #50C878;
      --muted: #64748b;
      --text: #0f1724;
      --input-border: 1px solid rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:24px;
      min-height:100vh;
      overflow-y:auto;
      transition:background .25s ease,color .25s ease;
    }

    .container{
      width:100%;
      max-width:920px;
      display: flex;
      flex-direction:column;
      align-items:center;
    }

    h1{margin:0 0 8px;
      font-size:28px;
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 0.75rem; 
      }
    h1 em{
      font-style: normal;
      color: var(--accent);
    }
    
    .lead{margin:0 0 18px;
          color:var(--muted)
          font-family: 'DM Sans', sans-serif;
         }

    .card{
      width:100%;
      margin-bottom:18px;
      padding:18px;
      border-radius:var(--radius);
      background:var(--card);
      box-shadow:0 6px 20px rgba(0,0,0,.4);
      transition:.25s ease;
    }

    .input-row{dis:flex;gap:8px;margin-top:8px}

    input{
      flex:1;
      padding:10px 12px;
      border-radius:8px;
      border:var(--input-border);
      background:var(--card);
      color:var(--text);
      outline:none;
    }

    .btn{
      background:var(--accent);
      border:none;
      color:var(#0f1724);
      padding:10px 14px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
    }

    .btn-secondary{
      background:transparent;
      border:1px solid rgba(255,255,255,.15);
      color:var(--text);
      padding:8px 10px;
      border-radius:8px;
      cursor:pointer;
    }

    .options{
      dis:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-top:12px;
      color:var(--muted);
      font-size:14px;
    }

    .video-list{dis:grid;gap:14px;margin-top:12px}

    .video-item{
      dis:flex;
      gap:12px;
      padding:10px;
      border-radius:10px;
      background:rgba(255,255,255,.03);
      align-items:center;
    }

    .video-thumb img{
      width:160px;height:90px;
      object-fit:cover;
      border-radius:8px;
    }

    .video-info{flex:1}
    .video-info h3{margin:0;font-size:16px}
    .video-info p{margin:4px 0 0;color:var(--muted);font-size:14px}

    .-mini{
      background:var(--accent);
      border:none;
      color:#fff;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    .er-wrapper{
      width:100%;
      border-radius:10px;
      overflow:hidden;
      background:#000;
    }

    .er-container{
      position:relative;
      padding-bottom:56.25%;
      height:0;
    }

    iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    .hidden{dis:none}

    .back-to-top{
      position:fixed;
      right:20px;
      bottom:-60px;
      background:var(--accent);
      border:none;
      color:#fff;
      padding:12px 16px;
      border-radius:8px;
      cursor:pointer;
      transition:.3s;
    }

    .back-to-top.show{bottom:20px}
  </style>
</head>

<body>
<main class="container">

  <h1 id="logoBtn" style="cursor:pointer;">Quick<em>Tube</em></h1>
  <p class="lead">Paste a YouTube link, search videos, or browse trending.</p>

  <div style="width:90%;dis:flex;justify-content:flex-end">
    <button id="themeToggle" class="btn-secondary">☀️ Light Mode</button>
  </div>

  <!-- ER -->
  <div class="card">
    <div class="input-row">
      <input id="urlInput" placeholder="YouTube URL or ID">
      <button id="playBtn" class="btn">Play</button>
    </div>

    <div class="options">
      <label><input type="checkbox" id="autoplay"> Autoplay</label>
      <label><input type="checkbox" id="nocookie" checked> No-Cookie</label>
      <label>Start: <input id="startAt" type="number" value="0" style="width:70px"></label>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <div class="input-row">
      <input id="searchInput" placeholder="Search YouTube...">
      <button id="searchBtn" class="btn-secondary">Search</button>
    </div>
    <div id="searchResults" class="video-list"></div>
  </div>

  <!-- TRENDING -->
  <div class="card">
    <h2>Trending</h2>
    <div id="trendingList" class="video-list"></div>
  </div>

  <!-- PLAYER -->
  <div id="playerWrapper" class="player-wrapper hidden">
    <div id="playerContainer" class="player-container"></div>
  </div>

</main>

<button id="backToTop" class="back-to-top hidden">Top ⬆</button>

<script defer>
const API_KEY = "YOUR_API_KEY";

const $ = id => document.getElementById(id);

// ---------------- THEME ----------------
const themeBtn = $("themeToggle");

function setTheme(isLight){
  document.documentElement.classList.toggle("light", isLight);
  localStorage.setItem("theme", isLight ? "light" : "dark");
  themeBtn.textContent = isLight ? "🌙 Dark Mode" : "☀️ Light Mode";
}

setTheme(localStorage.getItem("theme") === "light");

themeBtn.onclick = () =>
  setTheme(!document.documentElement.classList.contains("light"));

// ---------------- PLAYER ----------------
function getId(url){
  return url.match(/([A-Za-z0-9_-]{11})/)?.[0] || null;
}

function show(id){
  const autoplay = $("autoplay").checked ? 1 : 0;
  const start = $("startAt").value || 0;
  const nocookie = $("nocookie").checked;

  const base = nocookie
    ? "https://www.youtube-nocookie.com/embed/"
    : "https://www.youtube.com/embed/";

  $("playerContainer").innerHTML =
    `<iframe src="${base}${id}?autoplay=${autoplay}&start=${start}" allowfullscreen></iframe>`;

  $("playerWrapper").classList.remove("hidden");
}

// ---------------- EVENTS ----------------
$("playBtn").onclick = () => {
  const id = getId($("urlInput").value);
  if (id) show(id);
};

$("searchBtn").onclick = async () => {
  const q = $("searchInput").value;
  const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q=${q}&key=${API_KEY}`);
  const data = await res.json();

  $("searchResults").innerHTML = data.items.map(v => `
    <div class="video-item">
      <img src="${v.snippet.thumbnails.medium.url}">
      <div class="video-info">
        <h3>${v.snippet.title}</h3>
        <p>${v.snippet.channelTitle}</p>
      </div>
      <button class="play-mini" onclick="(${show})('${v.id.videoId}')">Play</button>
    </div>
  `).join("");
};

// ---------------- TRENDING ----------------
async function loadTrending(){
  const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&maxResults=10&regionCode=US&key=${API_KEY}`);
  const data = await res.json();

  $("trendingList").innerHTML = data.items.map(v => `
    <div class="video-item">
      <img src="${v.snippet.thumbnails.medium.url}">
      <div class="video-info">
        <h3>${v.snippet.title}</h3>
        <p>${v.snippet.channelTitle}</p>
      </div>
      <button class="play-mini" onclick="(${show})('${v.id}')">Play</button>
    </div>
  `).join("");
}

loadTrending();

// ---------------- BACK TO TOP ----------------
const topBtn = $("backToTop");

window.onscroll = () =>
  topBtn.classList.toggle("show", window.scrollY > 200);

topBtn.onclick = () =>
  window.scrollTo({ top: 0, behavior: "smooth" });

document.getElementById('logoBtn').addEventListener('click', () => {
  window.location.href = 'https://craftgamer9651.github.io' // go back to home
    
  });
</script>
</body>
</html>
