<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CutOut — Background Remover</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0f0f13;
    --bg2: #16161d;
    --bg3: #1e1e28;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eff5;
    --text2: #9896a8;
    --text3: #5f5e6e;
    --accent: #a78bfa;
    --accent2: #7c3aed;
    --accent-glow: rgba(167,139,250,0.18);
    --green: #34d399;
    --red: #f87171;
    --pill-bg: rgba(167,139,250,0.12);
    --radius: 14px;
    --radius-lg: 20px;
    --shadow: 0 4px 32px rgba(0,0,0,0.45);
  }
  [data-theme="light"] {
    --bg: #f5f4fa;
    --bg2: #ffffff;
    --bg3: #ede9f8;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #1a1825;
    --text2: #5f5c70;
    --text3: #9896a8;
    --accent: #6d28d9;
    --accent2: #4c1d95;
    --accent-glow: rgba(109,40,217,0.12);
    --pill-bg: rgba(109,40,217,0.08);
    --shadow: 0 4px 32px rgba(0,0,0,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--pill-bg);
    color: var(--accent);
    border: 1px solid rgba(167,139,250,0.2);
  }

  .theme-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border2);
    background: var(--bg2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.2s, transform 0.15s;
    color: var(--text);
  }
  .theme-btn:hover { background: var(--bg3); transform: scale(1.08); }

  /* MAIN LAYOUT */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 2rem 4rem;
  }

  /* HERO */
  .hero { text-align: center; margin-bottom: 2.5rem; }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 0.75rem;
  }
  .hero h1 em { color: var(--accent); font-style: normal; }
  .hero p { color: var(--text2); font-size: 1.05rem; max-width: 480px; margin: 0 auto; line-height: 1.6; }

  /* WORKSPACE */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 820px) {
    .workspace { grid-template-columns: 1fr; }
  }

  /* UPLOAD PANEL */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    box-shadow: var(--shadow);
  }
  .panel-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text3);
    margin-bottom: 1rem;
  }

  /* DROP ZONE */
  .dropzone {
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  .dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .dz-icon {
    width: 48px; height: 48px;
    margin: 0 auto 0.75rem;
    background: var(--bg3);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .dz-text { font-size: 0.9rem; color: var(--text2); line-height: 1.5; }
  .dz-text strong { color: var(--text); font-weight: 500; }
  .dz-hint { font-size: 0.78rem; color: var(--text3); margin-top: 4px; }

  /* CANVAS AREA */
  .canvas-wrap {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg3);
    min-height: 200px;
    display: flex; align-items: center; justify-content: center;
  }
  .canvas-wrap canvas { max-width: 100%; display: block; }
  .canvas-placeholder {
    color: var(--text3);
    font-size: 0.88rem;
    padding: 3rem 1rem;
    text-align: center;
  }

  /* CHECKERBOARD BG for output canvas */
  .checker-bg {
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%),
      linear-gradient(-45deg, #ccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ccc 75%),
      linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #fff;
  }
  [data-theme="dark"] .checker-bg {
    background-image:
      linear-gradient(45deg, #333 25%, transparent 25%),
      linear-gradient(-45deg, #333 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #333 75%),
      linear-gradient(-45deg, transparent 75%, #333 75%);
    background-color: #222;
  }

  /* PROGRESS */
  .progress-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 2rem;
    text-align: center;
  }
  .progress-wrap.visible { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 2.5px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-label { font-size: 0.88rem; color: var(--text2); }
  .progress-bar-wrap { width: 180px; height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s; width: 0%; }

  /* RESULT AREA */
  .result-section { display: none; }
  .result-section.visible { display: block; }

  .canvases-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 1rem;
  }
  .canvas-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 6px;
  }

  /* CONTROLS PANEL */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 0.75rem;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 13px;
    background: var(--accent);
    border-radius: 2px;
  }

  .bg-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .bg-tab {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .bg-tab:hover { border-color: var(--accent); color: var(--accent); }
  .bg-tab.active {
    background: var(--pill-bg);
    border-color: var(--accent);
    color: var(--accent);
  }

  .bg-option { display: none; }
  .bg-option.active { display: block; }

  /* Color picker row */
  .color-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem;
  }
  .color-row input[type="color"] {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: none;
    cursor: pointer;
    padding: 2px;
  }
  .color-row label { font-size: 13px; color: var(--text2); }

  /* Gradient controls */
  .gradient-row {
    display: flex; gap: 10px; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap;
  }
  .gradient-row input[type="color"] {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: none;
    cursor: pointer;
    padding: 2px;
  }
  .grad-dir {
    display: flex; gap: 5px; flex-wrap: wrap;
  }
  .dir-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .dir-btn.active, .dir-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--pill-bg);
  }

  /* BG Image upload */
  .bg-dropzone {
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 1.25rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    font-size: 13px;
    color: var(--text2);
  }
  .bg-dropzone:hover { border-color: var(--accent); background: var(--accent-glow); }
  .bg-dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .bg-thumb {
    width: 100%; height: 80px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 6px;
    display: none;
  }

  /* APPLY BTN */
  .apply-btn {
    width: 100%;
    padding: 11px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 0.75rem;
  }
  .apply-btn:hover { opacity: 0.88; }
  .apply-btn:active { transform: scale(0.98); }
  .apply-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* DOWNLOAD BTN */
  .download-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    padding: 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
    margin-top: 0.5rem;
  }
  .download-btn:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }

  /* DIVIDER */
  .divider { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

  /* STATUS CHIP */
  .status-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    font-weight: 500;
  }
  .status-chip.success { background: rgba(52,211,153,0.12); color: var(--green); }
  .status-chip.error { background: rgba(248,113,113,0.12); color: var(--red); }
  .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* SENSITIVITY SLIDER */
  .slider-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem;
  }
  .slider-row label { font-size: 13px; color: var(--text2); min-width: 80px; }
  .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .slider-val { font-size: 13px; color: var(--accent); min-width: 28px; text-align: right; font-weight: 500; }

  /* MODEL STATUS */
  .model-status {
    font-size: 12px; color: var(--text3);
    display: flex; align-items: center; gap: 6px;
    margin-top: 0.5rem;
  }

  /* COMPAT BANNER */
  .compat-banner {
    display: none;
    margin-bottom: 1.5rem;
    background: var(--bg2);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow);
  }
  .compat-banner.visible { display: block; }
  .compat-banner-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem;
  }
  .compat-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(248,113,113,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .compat-title {
    font-family: 'Syne', sans-serif;
    font-size: 1rem; font-weight: 700;
    color: var(--red);
  }
  .compat-subtitle { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .compat-body { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 1rem; }
  .compat-checks {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 1rem;
  }
  @media (max-width: 500px) { .compat-checks { grid-template-columns: 1fr; } }
  .compat-check {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
  }
  .compat-check .ci { font-size: 14px; }
  .compat-check .cl { color: var(--text2); }
  .compat-check.pass .ci::after { content: '✅'; }
  .compat-check.fail .ci::after { content: '❌'; }
  .compat-check.warn .ci::after { content: '⚠️'; }
  .compat-note {
    font-size: 12px; color: var(--text3);
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    line-height: 1.5;
  }
  .compat-note a { color: var(--accent); text-decoration: none; }
  .compat-note a:hover { text-decoration: underline; }
  .compat-dismiss {
    margin-top: 10px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .compat-dismiss:hover { border-color: var(--accent); color: var(--accent); }

  /* RESET BTN */
  .reset-link {
    font-size: 12px;
    color: var(--text3);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-family: inherit;
    transition: color 0.15s;
  }
  .reset-link:hover { color: var(--red); }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;
  }
</style>
</head>

<body data-theme="dark">

<header>
  <div class="logo" id="logoBtn" style="cursor:pointer;">Cut<span>Out</span></div>
  <div class="header-right">
    <span class="badge">AI-Powered</span>
    <button class="theme-btn" id="themeBtn">☀️</button>
  </div>
</header>

<main>

<div class="hero">
  <h1>Remove backgrounds<br><em>instantly</em></h1>
  <p>Upload any image — improved AI segmentation with sharper edges and better accuracy.</p>
</div>

<div class="workspace">

<!-- LEFT -->
<div class="panel" id="uploadPanel">

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*">
    <div class="dz-icon">🖼️</div>
    <div class="dz-text"><strong>Drop image</strong><br>or click to upload</div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="spinner"></div>
    <div class="progress-label" id="progressLabel">Loading…</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div class="result-section" id="resultSection">
    <div class="canvases-row">
      <div>
        <div class="canvas-label">Original</div>
        <div class="canvas-wrap"><canvas id="origCanvas"></canvas></div>
      </div>
      <div>
        <div class="canvas-label">Result</div>
        <div class="canvas-wrap checker-bg"><canvas id="resultCanvas"></canvas></div>
      </div>
    </div>

    <a id="downloadBtn" class="download-btn" download="cutout.png">⬇ Download PNG</a>
  </div>

</div>

<!-- RIGHT -->
<div class="panel">

<div class="panel-title">Background Options</div>

<button class="apply-btn" id="applyBtn" disabled>Apply</button>

</div>

</div>
</main>

<script type="module">
import {
  ImageSegmenter,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

let segmenter = null;
let segmenterPromise = null;

let alphaMask = null;
let srcPixels = null;
let W = 0, H = 0;

const fileInput = document.getElementById("fileInput");
const canvasO = document.getElementById("origCanvas");
const canvasR = document.getElementById("resultCanvas");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressLabel = document.getElementById("progressLabel");
const resultSection = document.getElementById("resultSection");
const applyBtn = document.getElementById("applyBtn");
const downloadBtn = document.getElementById("downloadBtn");

/* -------------------------
   UI helpers
------------------------- */
function setProgress(p, t){
  progressBar.style.width = p + "%";
  progressLabel.textContent = t;
}

/* -------------------------
   INIT MODEL (FIXED)
   - runs immediately on load
   - prevents first-upload freeze
------------------------- */
async function init(){
  try {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
    );

    segmenter = await ImageSegmenter.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass/float32/1/selfie_multiclass.tflite",
        delegate:"CPU"
      },
      outputCategoryMask:true,
      outputConfidenceMasks:true,
      runningMode:"IMAGE"
    });

    setProgress(100, "AI ready");
    setTimeout(()=>progressWrap.style.display="none", 400);

    console.log("Segmenter ready");
  } catch (e) {
      console.error("Model init failed:", e);
      console.error("Stack:", e?.stack);
      progressWrap.style.display="none";
      alert("AI model failed to load. Check console for details.");
  }
}

/* preload immediately (IMPORTANT FIX) */
progressWrap.style.display = "flex";
setProgress(5, "Loading AI model...");
segmenterPromise = init();

/* -------------------------
   Math helpers
------------------------- */
function smoothstep(a,b,x){
  const t = Math.min(1, Math.max(0,(x-a)/(b-a)));
  return t*t*(3-2*t);
}

function bilinear(mask,w,h,x,y){
  const x0=Math.floor(x), y0=Math.floor(y);
  const x1=Math.min(x0+1,w-1);
  const y1=Math.min(y0+1,h-1);

  const dx=x-x0, dy=y-y0;

  const i00=y0*w+x0;
  const i10=y0*w+x1;
  const i01=y1*w+x0;
  const i11=y1*w+x1;

  return (
    mask[i00]*(1-dx)*(1-dy)+
    mask[i10]*dx*(1-dy)+
    mask[i01]*(1-dx)*dy+
    mask[i11]*dx*dy
  );
}

function refine(mask,w,h){
  const out=new Float32Array(mask);
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i=y*w+x;
      const avg=(mask[i-1]+mask[i+1]+mask[i-w]+mask[i+w])*0.25;
      out[i]=mask[i]*0.7+avg*0.3;
    }
  }
  return out;
}

/* -------------------------
   IMAGE UPLOAD
------------------------- */
fileInput.addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file) return;

  progressWrap.style.display="flex";
  setProgress(10,"Loading image...");

  const img=new Image();
  img.src=URL.createObjectURL(file);
  await img.decode();

  W=img.width;
  H=img.height;

  const scale=Math.min(1,1024/Math.max(W,H));
  const w=Math.round(W*scale);
  const h=Math.round(H*scale);

  canvasO.width=w;
  canvasO.height=h;
  const ctx = canvasO.getContext("2d");
  ctx.drawImage(img,0,0,w,h);
  srcPixels = ctx.getImageData(0,0,w,h);

  /* wait for model (PRELOADED so usually instant) */
  await segmenterPromise;

  if(!segmenter || !segmenter.segment){
    progressWrap.style.display="none";
    alert("AI model not ready yet. Try again.");
    return;
  }

  setProgress(55,"Segmenting...");

  try {
    const res = await Promise.race([
      segmenter.segment(canvasO),
      new Promise((_,rej)=>setTimeout(()=>rej("timeout"),15000))
    ]);

    if(!res) throw new Error("No segmentation result");

    let conf;

    if (res.confidenceMasks?.length) {
      conf = res.confidenceMasks[0].getAsFloat32Array();
    } else {
      const cat = res.categoryMask.getAsUint8Array();
      conf = new Float32Array(cat.length);
      for (let i = 0; i < cat.length; i++) {
        conf[i] = cat[i] === 0 ? 0 : 1;
      }
    }

    const mask=new Float32Array(w*h);
    for(let i=0;i<mask.length;i++){
      mask[i]=Math.max(0,Math.min(1,(conf[i]-0.2)/0.8));
    }

    const refined=refine(mask,w,h);

    alphaMask=new Float32Array(w*h);

    const maskObj = res.confidenceMasks?.[0];
    const mw = maskObj?.width ?? w;
    const mh = maskObj?.height ?? h;

    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const mx=x*(mw/w);
        const my=y*(mh/h);
        alphaMask[y*w+x]=bilinear(refined,mw,mh,mx,my);
      }
    }

    setProgress(100,"Done");
    setTimeout(()=>progressWrap.style.display="none",300);

    resultSection.classList.add("visible");
    applyBtn.disabled=false;

    render();

  } catch(err){
    console.error("Segmentation error:", err);
    progressWrap.style.display="none";
    alert("Background removal failed. Try a smaller image or refresh.");
  }
});

/* -------------------------
   RENDER OUTPUT
------------------------- */
function render(){
  const w=canvasO.width,h=canvasO.height;
  canvasR.width=w; canvasR.height=h;

  const ctx=canvasR.getContext("2d");
  const out=ctx.createImageData(w,h);

  const thresh=0.5;

  for(let i=0;i<w*h;i++){
    const a=smoothstep(thresh-0.08,thresh+0.08,alphaMask[i]);
    const s=i*4;

    out.data[s]=srcPixels.data[s];
    out.data[s+1]=srcPixels.data[s+1];
    out.data[s+2]=srcPixels.data[s+2];
    out.data[s+3]=Math.round(a*255);
  }

  ctx.putImageData(out,0,0);
  downloadBtn.href=canvasR.toDataURL("image/png");
}
</script>
